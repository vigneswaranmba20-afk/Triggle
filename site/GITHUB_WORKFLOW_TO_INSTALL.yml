name: Publish Triggle from ZIP
on:
  push:
    paths:
      - 'Triggle_v124_Complete_Website.zip'
      - 'videos/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: triggle-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Unzip Triggle website and attach uploaded MP4s
        run: |
          mkdir -p site
          unzip -q Triggle_v124_Complete_Website.zip -d site
          if [ -d videos ]; then
            mkdir -p site/videos
            cp -a videos/. site/videos/
          fi
          python3 site/tools/build_video_catalog.py site
          test -f site/index.html
          test -f site/playground.html
          test -f site/data/video-lessons.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
