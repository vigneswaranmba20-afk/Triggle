<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 296" width="100%" role="img" aria-label="பயிற்சி 1.4 வினா 3-க்கான பலவற்றுக்கு ஒன்று அம்புக்குறிப் படம், அட்டவணை, வரைபடம்"><title>பயிற்சி 1.4 வினா 3-க்கான பலவற்றுக்கு ஒன்று அம்புக்குறிப் படம், அட்டவணை, வரைபடம்</title><desc>1, 2, 3 ஆகியவை 2-உடனும், 4 என்பது 3-உடனும், 5 என்பது 4-உடனும் இணைகின்றன. மதிப்பு அட்டவணையும் குறிக்கப்பட்ட புள்ளிகளும் உள்ளன.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#465166"/></marker><marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 Z" fill="#2B7A62"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#FCFBF8"/><text x="184" y="20" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="800" fill="#3B3468" text-anchor="middle">f = {(1,2), (2,2), (3,2), (4,3), (5,4)}</text><ellipse cx="60" cy="134" rx="32" ry="82" fill="#F4F0FA" stroke="#7868B8" stroke-width="1.6"/><ellipse cx="158" cy="134" rx="32" ry="68" fill="#EEF8F4" stroke="#2B7A62" stroke-width="1.6"/><text x="60" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="750" fill="#5A4990" text-anchor="middle">சார்பகம்</text><text x="158" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="750" fill="#215E4B" text-anchor="middle">வீச்சகம்</text><g font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="750" fill="#22253A" text-anchor="middle"><text x="60" y="78">1</text><text x="60" y="106">2</text><text x="60" y="134">3</text><text x="60" y="162">4</text><text x="60" y="190">5</text><text x="158" y="96">2</text><text x="158" y="134">3</text><text x="158" y="172">4</text></g><line x1="74" y1="74" x2="144" y2="92" stroke="#2B7A62" stroke-width="1.6" marker-end="url(#arrTeal)"/><line x1="7