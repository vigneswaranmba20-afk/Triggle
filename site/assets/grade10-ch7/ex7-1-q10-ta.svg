<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="title desc">
<title id="title">இடைக்கண்ட வடிவ விளக்குக் கவசத்தின் மேல் ஆரம் 6 செமீ, கீழ் ஆரம் 12 செமீ, செங்குத்து உயரம் 8 செமீ. வெளிப்புறச் சாய்பரப்பிலும் மேல் வட்டத்திலும் வண்ணம் பூசப்படுகிறது. கீழ்ப்பகுதி திறந்துள்ளது.</title>
<desc id="desc">இடைக்கண்ட வடிவ விளக்குக் கவசத்தின் மேல் ஆரம் 6 செமீ, கீழ் ஆரம் 12 செமீ, செங்குத்து உயரம் 8 செமீ. வெளிப்புறச் சாய்பரப்பிலும் மேல் வட்டத்திலும் வண்ணம் பூசப்படுகிறது. கீழ்ப்பகுதி திறந்துள்ளது.</desc>
<rect width="660" height="420" rx="18" fill="#fcfaf6"/>
<g font-family="system-ui,Arial,sans-serif" fill="#173750">
<text x="330" y="32" font-size="23" text-anchor="middle" font-weight="750">வெளிப்புறம், மேல் வட்டம்</text>
</g>
<!-- Frustum wall: a single continuous front half-ellipse, matching the lower rim exactly. -->
<path d="M206 122 L110 307 A190 38 0 0 0 490 307 L394 122 Z" fill="#dbeaf3" stroke="#236180" stroke-width="3" stroke-linejoin="round"/>
<!-- Dashed back half of the open bottom rim. The solid front half uses the same ellipse geometry. -->
<path d="M110 307 A190 38 0 0 1 490 307" fill="none" stroke="#456e83" stroke-width="2.5" stroke-dasharray="7 7"/>
<path d="M110 307 A190 38 0 0 0 490 307" fill="none" stroke="#236180" stroke-width="3"/>
<ellipse cx="300" cy="122" rx="94" ry="23" fill="#f7dfaa" stroke="#236180" stroke-width="3"/>
<!-- Direct measurement segments: centre to rim proves the horizontal quantities are radii. -->
<path id="upper-radius" d="M300 122 H394" stroke="#bf6d30" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<path id="lower-radius" d="M300 307 H490" stroke="#bf6d30" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<g fill="#bf6d30"><circle cx="300" cy="122" r="4.5"/><circle cx="394" cy="122" r="4.5"/><circle cx="300" cy="307" r="4.5"/><circle cx="490" cy="307" r="4.5"/></g>
<!-- The vertical centre axis is perpendicular to both circles. -->
<path id="vertical-height" d="M300 142 V297" stroke="#885e80" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<path d="M300 287 H318 V305" fill="none" stroke="#885e80" stroke-width="2"/>
<!-- Exterior callouts connect exactly to relevant edges without hiding them. -->
<g stroke="#657f97" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M394 120 L447 83 H458"/>
<path d="M490 307 L523 330 H529"/>
<path d="M442 218 L478 185 H486"/>
<path d="M146 231 L94 201 H84"/>
</g>
<g font-family="system-ui,Arial,sans-serif" fill="#173750" font-weight="700">
<rect x="460" y="58" width="150" height="37" rx="10" fill="#fff" stroke="#dce7ec"/>
<text x="470" y="83" font-size="20">r = 6 cm</text>
<rect x="514" y="327" width="140" height="40" rx="10" fill="#fff" stroke="#dce7ec"/>
<text x="525" y="353" font-size="20">R = 12 cm</text>
<!-- Height pill stays strictly between centre axis x=300 and right wall x>440. -->
<rect x="316" y="201" width="100" height="35" rx="9" fill="#fff" stroke="#dce7ec"/>
<text x="325" y="225" font-size="18">h = 8 cm</text>
<rect x="487" y="158" width="143" height="38" rx="10" fill="#fff" stroke="#dce7ec"/>
<text x="498" y="183" font-size="19">ℓ = 10 cm</text>
<rect x="12" y="178" width="132" height="40" rx="10" fill="#fff" stroke="#dce7ec"/>
<text x="22" y="204" font-size="18">வெளிப்புறச் சாய்பரப்பு</text>
<text x="300" y="80" font-size="19" text-anchor="middle">மேல் வட்டம்</text>
<text x="328" y="402" font-size="18" text-anchor="middle">திறந்த அடிப்பகுதி · வண்ணம் இல்லை</text>
</g>
</svg>