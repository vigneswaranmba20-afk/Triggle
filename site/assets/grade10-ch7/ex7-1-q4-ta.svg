<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="title desc">
<title id="title">Q-இல் செங்கோணம் கொண்ட PQR முக்கோணம். PQ = 12 செமீ, QR = 16 செமீ, கர்ணம் PR = 20 செமீ. செங்குத்தான இரு பக்கங்களில் ஏதேனும் ஒன்றை அச்சாகக் கொண்டு சுழற்றினால் கூம்பு கிடைக்கும்.</title>
<desc id="desc">Q-இல் செங்கோணம் கொண்ட PQR முக்கோணம். PQ = 12 செமீ, QR = 16 செமீ, கர்ணம் PR = 20 செமீ. செங்குத்தான இரு பக்கங்களில் ஏதேனும் ஒன்றை அச்சாகக் கொண்டு சுழற்றினால் கூம்பு கிடைக்கும்.</desc>
