<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="title desc">
<title id="title">Right triangle inside a conical tent</title>
<desc id="desc">A conical tent with slant height 19 metres and circular base area 88 square metres. A vertical dashed line from the apex to the base centre shows the unknown height h, and a horizontal radius r extends to the cone rim.</desc>
<rect width="680" height="470" rx="24" fill="#fffdf9"/>
<text x="340" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#28374a">A conical tent for four people</text>
<path d="M340 90 L164 362 Q340 406 516 362 Z" fill="#e5f4ee" stroke="#188f7a" stroke-width="4"/>
<ellipse cx="340" cy="363" rx="176" ry="44" fill="#d5eee3" stroke="#188f7a" stroke-width="3"/>
<path d="M340 90 V363" stroke="#d25b45" stroke-width="4" stroke-dasharray="10 8"/>
<path d="M340 363 H516" stroke="#22579a" stroke-width="4" stroke-dasharray="7 5"/>
<path d="M340 341 h20 v22" fill="none" stroke="#264369" stroke-width="3"/>
<g fill="#23374b" font-family="Arial,sans-serif" font-size="22" font-weight="600">
<text x="234" y="221" transform="rotate(-58 234 221)">Slant height = 19 m</text>
<text x="363" y="220" fill="#be4e37">h = ?</text>
<text x="428" y="349" fill="#22579a">r</text>
<text x="340" y="429" text-anchor="middle">Floor area = 4 × 22 = 88 m²</text>
</g>
<circle cx="340" cy="363" r="5" fill="#264369"/>
</svg>