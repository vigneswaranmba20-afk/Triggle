<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Tree diagram for tossing three fair coins showing 8 outcomes from HHH to TTT">
  <rect width="640" height="360" rx="14" fill="#f8fafc"/>
  <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Tree Diagram: Tossing Three Coins (8 Outcomes)</text>
  <text x="128" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">1st Coin</text>
  <text x="275" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">2nd Coin</text>
  <text x="425" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">3rd Coin</text>
  <text x="545" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Outcome</text>

  <!-- Branches: Root (42, 200) -> 1st Coin (128, 120/280) -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <line x1="46" y1="200" x2="114" y2="120"/>
    <line x1="46" y1="200" x2="114" y2="280"/>
    <!-- 1st H (128,120) -> 2nd (275, 80/160) -->
    <line x1="142" y1="120" x2="261" y2="85"/>
    <line x1="142" y1="120" x2="261" y2="155"/>
    <!-- 1st T (128,280) -> 2nd (275, 240/320) -->
    <line x1="142" y1="280" x2="261" y2="245"/>
    <line x1="142" y1="280" x2="261" y2="315"/>
    <!-- 2nd -> 3rd -->
    <line x1="289" y1="85" x2="411" y2="68"/>
    <line x1="289" y1="85" x2="411" y2="102"/>
    <line x1="289" y1="155" x2="411" y2="138"/>
    <line x1="289" y1="155" x2="411" y2="172"/>
    <line x1="289" y1="245" x2="411" y2="228"/>
    <line x1="289" y1="245" x2="411" y2="262"/>
    <line x1="289" y1="315" x2="411" y2="298"/>
    <line x1="289" y1="315" x2="411" y2="332"/>
  </g>

  <!-- Arrows to Outcomes -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="441" y1="68" x2="508" y2="68"/>
    <line x1="441" y1="102" x2="508" y2="102"/>
    <line x1="441" y1="138" x2="508" y2="138"/>
    <line x1="441" y1="172" x2="508" y2="172"/>
    <line x1="441" y1="228" x2="508" y2="228"/>
    <line x1="441" y1="262" x2="508" y2="262"/>
    <line x1="441" y1="298" x2="508" y2="298"/>
    <line x1="441" y1="332" x2="508" y2="332"/>
  </g>

  <!-- Root -->
  <circle cx="38" cy="200" r="10" fill="#4f46e5"/>
  <text x="38" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">S</text>

  <!-- Level 1 nodes -->
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="128" cy="120" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="128" y="124" fill="#312e81">H</text>
    <circle cx="128" cy="280" r="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="128" y="284" fill="#991b1b">T</text>
  </g>

  <!-- Level 2 nodes -->
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="275" cy="85" r="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="275" y="89" fill="#312e81">H</text>
    <circle cx="275" cy="155" r="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="275" y="159" fill="#991b1b">T</text>
    <circle cx="275" cy="245" r="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="275" y="249" fill="#312e81">H</text>
    <circle cx="275" cy="315" r="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="275" y="319" fill="#991b1b">T</text>
  </g>

  <!-- Level 3 nodes -->
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="425" cy="68" r="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="425" y="72" fill="#312e81">H</text>
    <circle cx="425" cy="102" r="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="425" y="106" fill="#991b1b">T</text>
    <circle cx="425" cy="138" r="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="425" y="142" fill="#312e81">H</text>
    <circle cx="425" cy="172" r="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="425" y="176" fill="#991b1b">T</text>
    <circle cx="425" cy="228" r="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="425" y="232" fill="#312e81">H</text>
    <circle cx="425" cy="262" r="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="425" y="266" fill="#991b1b">T</text>
    <circle cx="425" cy="298" r="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="425" y="302" fill="#312e81">H</text>
    <circle cx="425" cy="332" r="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="425" y="336" fill="#991b1b">T</text>
  </g>

  <!-- Outcome Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="514" y="56" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="72" fill="#0f172a">HHH</text>
    <rect x="514" y="90" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="106" fill="#0f172a">HHT</text>
    <rect x="514" y="126" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="142" fill="#0f172a">HTH</text>
    <rect x="514" y="160" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="176" fill="#0f172a">HTT</text>
    <rect x="514" y="216" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="232" fill="#0f172a">THH</text>
    <rect x="514" y="250" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="266" fill="#0f172a">THT</text>
    <rect x="514" y="286" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="302" fill="#0f172a">TTH</text>
    <rect x="514" y="320" width="64" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="336" fill="#0f172a">TTT</text>
  </g>
</svg>
