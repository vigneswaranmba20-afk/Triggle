<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="4 feet by 3 feet rectangular target containing a circular winning region of radius 1 foot">
  <rect width="420" height="310" rx="14" fill="#f8fafc"/>
  <!-- Rectangle: 280 x 210 centered at (200, 155) => x=60..340, y=50..260 (scale: 70px = 1 ft) -->
  <rect x="60" y="50" width="280" height="210" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Top dimension label: 4 feet -->
  <text x="200" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">4 feet</text>

  <!-- Right dimension label: 3 feet -->
  <text x="368" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" transform="rotate(-90 368 155)">3 feet</text>

  <!-- Circular region: center (200, 155), radius 70px (= 1 ft) -->
  <circle cx="200" cy="155" r="70" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
  <circle cx="200" cy="155" r="3.5" fill="#9333ea"/>

  <!-- Radius line -->
  <line x1="200" y1="155" x2="270" y2="155" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">1 ft</text>

  <!-- Region labels -->
  <text x="200" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6b21a8" text-anchor="middle">Win (circle)</text>
  <text x="115" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">Loss (outside)</text>
</svg>
