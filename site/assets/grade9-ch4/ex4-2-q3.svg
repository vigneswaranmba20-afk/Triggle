<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Rectangle ABCD with intersecting diagonals for Exercise 4.2 Q3</title>
  <desc id="desc">Rectangle ABCD with diagonals AC and BD intersecting at O, showing angle OAB = 46 deg and angle OBC to find.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <rect x="58" y="48" width="204" height="124" fill="#E6EFEA" fill-opacity="0.35" stroke="#181B20" stroke-width="2.2"/>
  <line x1="58" y1="48" x2="262" y2="172" stroke="#166353" stroke-width="1.8"/>
  <line x1="58" y1="172" x2="262" y2="48" stroke="#6E2933" stroke-width="1.8"/>
  <circle cx="160" cy="110" r="3.2" fill="#181B20"/>
  <text x="48" y="180" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#181B20">A</text>
  <text x="270" y="180" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#181B20">B</text>
  <text x="270" y="45" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#181B20">C</text>
  <text x="48" y="45" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#181B20">D</text>
  <text x="160" y="96" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#181B20">O</text>
  <text x="92" y="164" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">46°</text>
  <text x="252" y="138" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#166353">∠OBC = ?</text>
</svg>
