<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 224" role="img" aria-labelledby="title desc">
  <title id="title">Triangle ABC and its angle bisectors</title>
  <desc id="desc">Angle A is 64 degrees. Angle ABC is 58 degrees. The bisectors BO and CO meet at O. The marked unknowns are angle BOC and angle ACO.</desc>
  <g fill="none" stroke="#263755" stroke-width="2.2" stroke-linejoin="round">
    <polygon data-dg-obstacle="triangle" points="160.000000,36.367885 64.000000,190.000000 256.000000,190.000000"/>
    <polyline data-dg-obstacle="bisectors" points="64.000000,190.000000 160.000000,136.786331 256.000000,190.000000"/>
  </g>
  <g fill="none" stroke="#973f19" stroke-width="2" stroke-linecap="round">
    <path data-dg-obstacle="angle-A" d="M 147.281938,56.721040 A 24 24 0 0 0 172.718062,56.721040"/>
    <path data-dg-obstacle="angle-B" d="M 96.000000,190.000000 A 32 32 0 0 0 80.957416,162.862461"/>
    <path data-dg-obstacle="angle-O" d="M 146.006085,144.543285 A 16 16 0 0 0 173.993915,144.543285"/>
    <path data-dg-obstacle="angle-C" d="M 224.513691,172.546854 A 36 36 0 0 1 236.922906,159.470269"/>
  </g>
  <g fill="#263755" font-family="system-ui, sans-serif" font-size="15" font-weight="550" text-anchor="middle">
    <text data-dg-label="A" x="160" y="22">A</text>
    <text data-dg-label="B" x="54" y="210">B</text>
    <text data-dg-label="C" x="266" y="210">C</text>
    <text data-dg-label="O" x="160" y="123">O</text>
    <text data-dg-label="64°" x="160" y="86">64°</text>
    <text data-dg-label="58°" x="130" y="182">58°</text>
    <text data-dg-label="x°" x="160" y="175">x°</text>
    <text data-dg-label="y°" x="206" y="151">y°</text>
  </g>
</svg>
