<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Congruent triangles ABC and FDE for Exercise 4.1 Q4</title>
  <desc id="desc">Two triangles ABC and FDE showing corresponding equal angles B=60 deg, C=70 deg and D=60 deg, E=70 deg with AB=DF.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <polygon points="32,175 138,175 96,52" fill="#E6EFEA" fill-opacity="0.45" stroke="#181B20" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="182,175 288,175 246,52" fill="#E6EFEA" fill-opacity="0.45" stroke="#166353" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="24" y="182" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#181B20">B</text>
  <text x="146" y="182" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#181B20">C</text>
  <text x="96" y="42" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#181B20">A</text>
  <text x="52" y="168" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">60°</text>
  <text x="112" y="168" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#166353">70°</text>
  <text x="54" y="110" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#181B20">AB</text>
  <text x="174" y="182" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#166353">D</text>
  <text x="296" y="182" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#166353">E</text>
  <text x="246" y="42" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#166353">F</text>
  <text x="202" y="168" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">60°</text>
