<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Congruent triangles ABC and FDE for Exercise 4.1 Q4</title>
  <desc id="desc">Two triangles ABC and FDE showing corresponding equal angles B=60 deg, C=70 deg and D=60 deg, E=70 deg with AB=DF.</desc>
  <style>text{font:700 12px system-ui,sans-serif;fill:#181B20;paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <polygon points="89.3341,59.7663 28,166 128,166" fill="#E6EFEA" stroke="#181B20" stroke-width="2"/>
  <text x="89.3341" y="50.7663" text-anchor="middle">A</text>
  <text x="20" y="179" text-anchor="end">B</text>
  <text x="136" y="179" >C</text>
  <text x="43" y="158" >60°</text>
  <text x="93" y="158" >70°</text>
  <text x="49.667" y="112.8831" text-anchor="end">AB</text>
  <line x1="53.667" y1="109.8831" x2="63.667" y2="115.8831" stroke-width="1.8" stroke="#181B20"/>
  <polygon points="239.3341,59.7663 178,166 278,166" fill="#E6EFEA" stroke="#181B20" stroke-width="2"/>
  <text x="239.3341" y="50.7663" text-anchor="middle">F</text>
  <text x="170" y="179" text-anchor="end">D</text>
  <text x="286" y="179" >E</text>
  <text x="193" y="158" >60°</text>
  <text x="243" y="158" >70°</text>
  <text x="199.667" y="112.8831" text-anchor="end">DF</text>
  <line x1="203.667" y1="109.8831" x2="213.667" y2="115.8831" stroke-width="1.8" stroke="#181B20"/>
</svg>
