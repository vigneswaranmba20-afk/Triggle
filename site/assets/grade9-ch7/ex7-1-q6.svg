  <polygon points="62,178 134,54 156,144" fill="#166353" fill-opacity="0.28" stroke="#166353" stroke-width="2" stroke-linejoin="round"/>
  <line x1="62" y1="178" x2="134" y2="54" stroke="#6E2933" stroke-width="2" stroke-dasharray="4 3"/>
