<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title">
  <title id="title">Rectangular garden 16 m by 12 m surrounded by a uniform pathway of width w metres</title>
  <rect width="320" height="200" rx="10" fill="#ffffff"/>
  <rect x="42" y="28" width="236" height="140" rx="4" fill="#eef4ff" stroke="#283262" stroke-width="2"/>
  <rect x="74" y="54" width="172" height="88" rx="2" fill="#fdf2f7" stroke="#a52662" stroke-width="2"/>
  <g fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="18" font-weight="700">Outer length = (16 + 2w) m</text>
    <text x="160" y="191" font-size="11.5" fill="#29638c" font-weight="600">Total area (garden + pathway) = 285 m²</text>
    <text x="58" y="91" font-weight="700" fill="#29638c" paint-order="stroke" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">w</text>
    <text x="262" y="91" font-weight="700" fill="#29638c" paint-order="stroke" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">w</text>
    <text x="171" y="45" font-weight="700" fill="#29638c" paint-order="stroke" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">w</text>
    <text x="171" y="160" font-weight="700" fill="#29638c" paint-order="stroke" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">w</text>
  </g>
  <g stroke="#29638c" stroke-width="1.4" stroke-dasharray="3 2">
    <line x1="42" y1="98" x2="74" y2="98"/>
    <line x1="246" y1="98" x2="278" y2="98"/>
    <line x1="160" y1="28" x2="160" y2="54"/>
    <line x1="160" y1="142" x2="160" y2="168"/>
  </g>
  <g fill="#a52662" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="160" y="94">Garden</text>
    <text x="160" y="112">16 m × 12 m</text>
  </g>
  <text x="298" y="98" fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" transform="rotate(-90 298 98)">(12 + 2w) m</text>
</svg>
