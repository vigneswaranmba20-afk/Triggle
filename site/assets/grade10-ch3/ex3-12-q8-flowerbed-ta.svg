<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="320" height="210" viewBox="0 0 320 210" role="img" aria-labelledby="title">
  <title id="title">10 மீ பக்கமுள்ள சதுர நிலத்தின் நடுவில் (10 − 2w) மீ பக்கமுள்ள சதுர மலர்ப்பாத்தி உள்ளது. அதைச் சுற்றி w மீ அகலமுள்ள சரளைக் கல் பாதை உள்ளது.</title>
  <rect width="320" height="210" rx="10" fill="#ffffff"/>
  <rect x="85" y="24" width="150" height="150" rx="3" fill="#eef4ff" stroke="#283262" stroke-width="2"/>
  <rect x="115" y="54" width="90" height="90" rx="2" fill="#fdf2f7" stroke="#a52662" stroke-width="2"/>
  <g stroke="#29638c" stroke-width="1.4" stroke-dasharray="3 2">
    <line x1="85" y1="99" x2="115" y2="99"/>
    <line x1="205" y1="99" x2="235" y2="99"/>
    <line x1="160" y1="24" x2="160" y2="54"/>
    <line x1="160" y1="144" x2="160" y2="174"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#283262">
    <text x="160" y="16" font-size="12" font-weight="700">வெளிச் சதுரம் 10 மீ × 10 மீ</text>
    <text x="99" y="89" font-size="11.5" font-weight="700" fill="#29638c">w</text>
    <text x="221" y="89" font-size="11.5" font-weight="700" fill="#29638c">w</text>
    <text x="175" y="42" font-size="11.5" font-weight="700" fill="#29638c">w</text>
    <text x="175" y="164" font-size="11.5" font-weight="700" fill="#29638c">w</text>
    <text x="160" y="89" font-size="12" font-weight="700" fill="#a52662">மலர்ப்பாத்தி</text>
    <text x="160" y="116" font-size="11.5" font-weight="700" fill="#a52662">(10 − 2w) m</text>
    <text x="160" y="194" font-size="11" fill="#29638c" font-weight="600">மலர்ப்பாத்தி ₹3/மீ² · பாதை ₹4/மீ² · மொத்தம் ₹364</text>
  </g>
</svg>
