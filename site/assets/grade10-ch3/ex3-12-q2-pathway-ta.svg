<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="320" height="244" viewBox="0 0 320 244" role="img" aria-labelledby="title">
  <title id="title">16 மீ நீளமும் 12 மீ அகலமும் உள்ள செவ்வகத் தோட்டத்தைச் சுற்றி w மீ அகலமுள்ள பாதை உள்ளது. வெளிப்புற நீளம் (16 + 2w) மீ, அகலம் (12 + 2w) மீ, மொத்தப் பரப்பளவு 285 சதுர மீ.</title>
  <rect width="320" height="244" rx="10" fill="#ffffff"/>
  <rect x="36.5" y="28" width="247" height="195" rx="4" fill="#eef4ff" stroke="#283262" stroke-width="1.5"/>
  <rect x="56" y="47.5" width="208" height="156" rx="2" fill="#fdf2f7" stroke="#a52662" stroke-width="1.5"/>
  <g fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="18" font-weight="700">வெளி நீளம் = (16 + 2w) மீ</text>
    <text x="160" y="238" font-size="11.5" fill="#29638c" font-weight="600">மொத்தப் பரப்பு = 285 மீ²</text>
    <text x="46.25" y="117" font-weight="700" fill="#29638c">w</text>
    <text x="273.75" y="117" font-weight="700" fill="#29638c">w</text>
    <text x="175" y="37.75" dominant-baseline="central" font-weight="700" fill="#29638c">w</text>
    <text x="175" y="213.25" dominant-baseline="central" font-weight="700" fill="#29638c">w</text>
  </g>
  <g stroke="#29638c" stroke-width="1.4" stroke-dasharray="3 2">
    <line x1="36.5" y1="123" x2="56" y2="123"/>
    <line x1="264" y1="123" x2="283.5" y2="123"/>
    <line x1="160" y1="28" x2="160" y2="47.5"/>
    <line x1="160" y1="203.5" x2="160" y2="223"/>
  </g>
  <g fill="#a52662" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="160" y="104">தோட்டம்</text>
    <text x="160" y="131">16 m × 12 m</text>
  </g>
  <text x="302" y="123" fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" transform="rotate(-90 302 123)">(12 + 2w) m</text>
</svg>
