<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title">
  <title id="title">16 மீ நீளமும் 12 மீ அகலமும் உள்ள செவ்வகத் தோட்டத்தைச் சுற்றி w மீ அகலமுள்ள பாதை உள்ளது. வெளிப்புற நீளம் (16 + 2w) மீ, அகலம் (12 + 2w) மீ, மொத்தப் பரப்பளவு 285 சதுர மீ.</title>
  <rect width="320" height="200" rx="10" fill="#ffffff"/>
  <rect x="42" y="28" width="236" height="140" rx="4" fill="#eef4ff" stroke="#283262" stroke-width="2"/>
  <rect x="74" y="54" width="172" height="88" rx="2" fill="#fdf2f7" stroke="#a52662" stroke-width="2"/>
  <g fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="18" font-weight="700">வெளி நீளம் = (16 + 2w) மீ</text>
    <text x="160" y="191" font-size="11.5" fill="#29638c" font-weight="600">மொத்தப் பரப்பு = 285 மீ²</text>
    <text x="58" y="102" font-weight="700" fill="#29638c">w</text>
    <text x="262" y="102" font-weight="700" fill="#29638c">w</text>
    <text x="160" y="45" font-weight="700" fill="#29638c">w</text>
    <text x="160" y="160" font-weight="700" fill="#29638c">w</text>
  </g>
  <g stroke="#29638c" stroke-width="1.4" stroke-dasharray="3 2">
    <line x1="42" y1="98" x2="74" y2="98"/>
    <line x1="246" y1="98" x2="278" y2="98"/>
    <line x1="160" y1="28" x2="160" y2="54"/>
    <line x1="160" y1="142" x2="160" y2="168"/>
  </g>
  <g fill="#a52662" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="160" y="94">தோட்டம்</text>
    <text x="160" y="112">16 m × 12 m</text>
  </g>
  <text x="298" y="98" fill="#283262" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" transform="rotate(-90 298 98)">(12 + 2w) m</text>
</svg>
