<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title">
  <title id="title">20 மீ விட்டம் PQ கொண்ட வட்டம். வட்டத்தின் மீதுள்ள R-இல் கோணம் PRQ செங்கோணம். நாண்கள் PR, QR இன் நீளங்கள் x + 4 மீ மற்றும் x மீ.</title>
  <rect width="320" height="200" rx="10" fill="#ffffff"/>
  <circle cx="160" cy="112" r="74" fill="#eef4ff" stroke="#283262" stroke-width="2"/>
  <polygon points="86,112 234,112 180.7,41.0" fill="#fdf2f7" fill-opacity="0.7" stroke="#a52662" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="86" y1="112" x2="234" y2="112" stroke="#283262" stroke-width="2"/>
  <!-- Right angle marker at R=(180.7, 41.0) where PR=118.4px (16m) and QR=88.8px (12m) -->
  <path d="M172.7 47.0 L178.7 55.0 L186.7 49.0" fill="none" stroke="#283262" stroke-width="1.6"/>
  <g fill="#283262">
    <circle cx="86" cy="112" r="4"/>
    <circle cx="234" cy="112" r="4"/>
    <circle cx="160" cy="112" r="3"/>
    <circle cx="180.7" cy="41.0" r="4.2" fill="#a52662"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#283262">
    <text x="68" y="116" text-anchor="end">P</text>
    <text x="242" y="116" text-anchor="start">Q</text>
    <text x="160" y="128" text-anchor="middle" font-size="11.5">விட்டம் PQ = 20 மீ</text>
    <text x="180.7" y="29" text-anchor="middle" fill="#a52662">R (கம்பம், ∠R = 90°)</text>
    <text x="122" y="68" text-anchor="end" fill="#29638c">(x + 4) m</text>
    <text x="216" y="72" text-anchor="start" fill="#29638c">x m</text>
  </g>
</svg>
