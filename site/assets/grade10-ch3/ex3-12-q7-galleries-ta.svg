<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" width="320" height="175" viewBox="0 0 320 175" role="img" aria-labelledby="title">
  <title id="title">70 மீ இடைவெளியில் எதிரெதிரே உள்ள இரு அரங்குகளில் முறையே 4 மற்றும் 9 பாடகர்கள் உள்ளனர். கேட்பவர் P முதல் அரங்கிலிருந்து x மீ தொலைவிலும் இரண்டாம் அரங்கிலிருந்து (70 − x) மீ தொலைவிலும் உள்ளார்.</title>
  <rect width="320" height="175" rx="10" fill="#ffffff"/>
  <rect x="16" y="34" width="66" height="58" rx="6" fill="#eef4ff" stroke="#283262" stroke-width="2"/>
  <rect x="238" y="34" width="66" height="58" rx="6" fill="#fdf2f7" stroke="#a52662" stroke-width="2"/>
  <line x1="82" y1="68" x2="238" y2="68" stroke="#283262" stroke-width="2"/>
  <circle cx="144" cy="68" r="5.5" fill="#29638c"/>
  <path d="M90 56 A12 12 0 0 1 90 80" fill="none" stroke="#29638c" stroke-width="1.5"/>
  <path d="M230 56 A12 12 0 0 0 230 80" fill="none" stroke="#a52662" stroke-width="1.5"/>
  <line x1="82" y1="126" x2="238" y2="126" stroke="#283262" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="82" y1="118" x2="82" y2="134" stroke="#283262" stroke-width="1.5"/>
  <line x1="238" y1="118" x2="238" y2="134" stroke="#283262" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#283262">
    <text x="49" y="57" font-size="11.5" font-weight="700">அரங்கு 1</text>
    <text x="49" y="75" font-size="11" fill="#29638c" font-weight="600">4 பாடகர்கள்</text>
    <text x="271" y="57" font-size="11.5" font-weight="700" fill="#a52662">அரங்கு 2</text>
    <text x="271" y="75" font-size="11" fill="#a52662" font-weight="600">9 பாடகர்கள்</text>
    <text x="144" y="49" font-size="11.5" font-weight="700" fill="#29638c">கேட்பவர் P</text>
    <text x="113" y="88" font-size="11.5" font-weight="700" fill="#29638c">x m</text>
    <text x="191" y="88" font-size="11.5" font-weight="700" fill="#a52662">(70 − x) m</text>
    <text x="160" y="144" font-size="11.5" font-weight="700">மொத்தத் தொலைவு = 70 மீ</text>
    <text x="160" y="162" font-size="11" fill="#29638c">சம ஒலிச்செறிவு ⇒ 4/9 = x²/(70 − x)²</text>
  </g>
</svg>
