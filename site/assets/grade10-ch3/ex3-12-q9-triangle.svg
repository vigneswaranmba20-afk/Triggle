<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" role="img" aria-labelledby="title">
  <title id="title">Right angled triangle with hypotenuse 25 cm, legs x cm and (31 − x) cm, and perimeter 56 cm</title>
  <rect width="320" height="190" rx="10" fill="#ffffff"/>
  <polygon points="74,40 74,145 254,145" fill="#eef4ff" stroke="#283262" stroke-width="2.2" stroke-linejoin="round"/>
  <polyline points="74,131 88,131 88,145" fill="none" stroke="#a52662" stroke-width="1.8"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#283262">
    <text x="64" y="96" font-size="12" text-anchor="end" fill="#29638c">x cm</text>
    <text x="164" y="163" font-size="12" text-anchor="middle" fill="#29638c">(31 − x) cm</text>
    <text x="180" y="84" font-size="12" text-anchor="start" fill="#a52662">25 cm (hypotenuse)</text>
    <text x="160" y="24" font-size="12" text-anchor="middle">Perimeter = 56 cm ⇒ x + y = 31 cm</text>
    <text x="160" y="180" font-size="11" text-anchor="middle" fill="#29638c" font-weight="600">Pythagoras theorem: x² + (31 − x)² = 25²</text>
  </g>
</svg>
