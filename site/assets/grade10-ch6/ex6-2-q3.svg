<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Observer looking at bottom and top of a window for Exercise 6.2 Q3</title>
  <desc id="desc">A 1.8 m man stands 5 m from a wall and looks at bottom and top of a window at 45 and 60 degrees.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="30" y1="194" x2="290" y2="194" stroke="#525B62" stroke-width="1.4"/>
  <line x1="250" y1="24" x2="250" y2="194" stroke="#181B20" stroke-width="2.2"/>
  <rect x="246" y="42" width="8" height="58" fill="#166353" fill-opacity="0.35" stroke="#166353" stroke-width="1.5"/>
  <line x1="68" y1="158" x2="68" y2="194" stroke="#181B20" stroke-width="2.2"/>
  <circle cx="68" cy="154" r="3.5" fill="#181B20"/>
  <line x1="68" y1="158" x2="250" y2="158" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="68" y1="158" x2="250" y2="100" stroke="#166353" stroke-width="1.8"/>
  <line x1="68" y1="158" x2="250" y2="42" stroke="#6E2933" stroke-width="1.8"/>
  <text x="158" y="172" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#181B20">5 m</text>
  <text x="116" y="152" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#166353">45°</text>
  <text x="104" y="128" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">60°</text>
  <text x="260" y="74" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#166353">Window h</text>
  <text x="58" y="180" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="end" fill="#181B20">1.8 m</text>
</svg>
