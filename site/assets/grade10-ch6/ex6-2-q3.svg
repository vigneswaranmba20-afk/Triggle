<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Observer looking at bottom and top of a window for Exercise 6.2 Q3</title>
  <desc id="desc">A 1.8 m man stands 5 m from a wall and looks at bottom and top of a window at 45 and 60 degrees.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="28" y1="192" x2="292" y2="192" stroke="#525B62" stroke-width="1.4"/>
  <line x1="248" y1="24" x2="248" y2="192" stroke="#181B20" stroke-width="2.2"/>
  <rect x="244" y="34" width="8" height="66" fill="#166353" fill-opacity="0.35" stroke="#166353" stroke-width="1.5"/>
  <line x1="68" y1="154" x2="68" y2="192" stroke="#181B20" stroke-width="2.2"/>
  <circle cx="68" cy="149" r="3.5" fill="#181B20"/>
  <line x1="68" y1="154" x2="248" y2="154" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="68" y1="154" x2="248" y2="100" stroke="#166353" stroke-width="1.8"/>
  <line x1="68" y1="154" x2="248" y2="34" stroke="#6E2933" stroke-width="1.8"/>
  <path d="M120.0,154.0 A52,52 0 0,0 117.8,139.1" fill="none" stroke="#166353" stroke-width="1.3"/>
  <path d="M102.0,154.0 A34,34 0 0,0 96.3,135.1" fill="none" stroke="#6E2933" stroke-width="1.3"/>
