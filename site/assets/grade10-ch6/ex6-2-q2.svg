  <line x1="160" y1="180" x2="66" y2="88" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="160" y1="180" x2="254" y2="88" stroke="#166353" stroke-width="1.8" stroke-dasharray="4,2"/>
