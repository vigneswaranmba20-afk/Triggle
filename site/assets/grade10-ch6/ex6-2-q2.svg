<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Road flanked by two houses of height 4 root 3 metres for Exercise 6.2 Q2</title>
  <desc id="desc">Pedestrian at the midpoint M of a road sees roof tops of two houses height 4 root 3 m at 30 degrees elevation.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
