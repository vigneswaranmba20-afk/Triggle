  <rect x="254" y="72" width="22" height="108" fill="#E6EFEA" stroke="#181B20" stroke-width="1.6"/>
  <line x1="160" y1="180" x2="66" y2="72" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="160" y1="180" x2="254" y2="72" stroke="#166353" stroke-width="1.8" stroke-dasharray="4,2"/>
