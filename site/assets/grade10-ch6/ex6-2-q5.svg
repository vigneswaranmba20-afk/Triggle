<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Flag pole of height h on hemispherical dome of radius r for Exercise 6.2 Q5</title>
  <desc id="desc">Hemispherical dome radius r topped by pole h. At 7 m from dome elevation to pole top is 45 degrees; 5 m further elevation to pole bottom is 30 degrees.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="22" y1="184" x2="298" y2="184" stroke="#525B62" stroke-width="1.5"/>
  <path d="M48,184 A68,68 0 0,1 184,184 Z" fill="#E6EFEA" fill-opacity="0.7" stroke="#181B20" stroke-width="1.6"/>
  <line x1="116" y1="116" x2="116" y2="184" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="116" y1="36" x2="116" y2="116" stroke="#6E2933" stroke-width="2.4"/>
  <rect x="116" y="36" width="22" height="13" fill="#6E2933" fill-opacity="0.2" stroke="#6E2933" stroke-width="1.2"/>
  <line x1="234" y1="184" x2="116" y2="36" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="286" y1="184" x2="116" y2="116" stroke="#166353" stroke-width="1.8"/>
  <path d="M210.0,184.0 A24,24 0 0,1 219.0,165.2" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <path d="M252.0,184.0 A34,34 0 0,1 254.4,171.4" fill="none" stroke="#166353" stroke-width="1.3"/>
  <text x="104" y="150" transform="rotate(-90 104 150)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#181B20">r</text>
  <text x="104" y="76" transform="rotate(-90 104 76)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#6E2933">h</text>
  <text x="150" y="176" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">r</text>
  <text x="209" y="201" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">7 m</text>
  <text x="260" y="201" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">5 m</text>
  <text x="202" y="175" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#6E2933">45°</text>
  <text x="252" y="160" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#166353">30°</text>
</svg>
