<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Flag pole of height h on hemispherical dome of radius r for Exercise 6.2 Q5</title>
  <desc id="desc">Hemispherical dome radius r topped by pole h. At 7 m from dome elevation to pole top is 45 degrees; 5 m further elevation to pole bottom is 30 degrees.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="186" x2="296" y2="186" stroke="#525B62" stroke-width="1.5"/>
  <path d="M50,186 A68,68 0 0,1 186,186 Z" fill="#E6EFEA" fill-opacity="0.7" stroke="#181B20" stroke-width="1.6"/>
  <line x1="118" y1="118" x2="118" y2="186" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="118" y1="42" x2="118" y2="118" stroke="#6E2933" stroke-width="2.4"/>
  <rect x="118" y="42" width="22" height="13" fill="#6E2933" fill-opacity="0.2" stroke="#6E2933" stroke-width="1.2"/>
  <line x1="234" y1="186" x2="118" y2="42" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="286" y1="186" x2="118" y2="118" stroke="#166353" stroke-width="1.8"/>
  <text x="108" y="156" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#181B20">r</text>
  <text x="108" y="84" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#6E2933">h</text>
  <text x="150" y="180" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">r</text>
  <text x="210" y="201" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">7 m</text>
  <text x="260" y="201" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#181B20">5 m</text>
  <text x="213" y="179" font-family="system-ui,sans-serif" font-size="9.2" font-weight="700" fill="#6E2933">45°</text>
  <text x="257" y="180" font-family="system-ui,sans-serif" font-size="9.2" font-weight="700" fill="#166353">30°</text>
</svg>
