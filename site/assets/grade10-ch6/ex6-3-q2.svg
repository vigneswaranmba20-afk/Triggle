<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Two buildings 70 m apart with 45 degrees depression for Exercise 6.3 Q2</title>
  <desc id="desc">Second building is 120 m tall and first building roof is at 45 degrees depression across 70 m gap.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="26" y1="190" x2="294" y2="190" stroke="#525B62" stroke-width="1.5"/>
  <rect x="64" y="120" width="24" height="70" fill="#E6EFEA" stroke="#181B20" stroke-width="1.6"/>
  <rect x="226" y="40" width="24" height="150" fill="#E6EFEA" stroke="#181B20" stroke-width="1.6"/>
  <line x1="138" y1="40" x2="226" y2="40" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="88" y1="120" x2="226" y2="120" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="226" y1="40" x2="88" y2="120" stroke="#6E2933" stroke-width="2"/>
  <path d="M188.0,40.0 A38,38 0 0,0 193.1,59.0" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <path d="M124.0,120.0 A36,36 0 0,0 119.2,102.0" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <text x="182" y="54" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#6E2933">45°</text>
  <text x="132" y="113" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#6E2933">45°</text>
  <text x="157" y="182" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#181B20">70 m</text>
  <text x="265" y="115" transform="rotate(-90 265 115)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#181B20">120 m</text>
  <text x="50" y="155" transform="rotate(-90 50 155)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#166353">h</text>
