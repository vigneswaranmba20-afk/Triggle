<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Lamp post viewed at 38 and 60 degrees depression from 60 m tower for Exercise 6.3 Q3</title>
  <desc id="desc">Tower height 60 m looks down at lamp post top (38 deg) and bottom (60 deg).</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="28" y1="190" x2="292" y2="190" stroke="#525B62" stroke-width="1.5"/>
  <line x1="74" y1="42" x2="74" y2="190" stroke="#181B20" stroke-width="2.8"/>
  <line x1="234" y1="108" x2="234" y2="190" stroke="#166353" stroke-width="2.8"/>
  <line x1="74" y1="42" x2="258" y2="42" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="74" y1="42" x2="234" y2="108" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="74" y1="42" x2="234" y2="190" stroke="#166353" stroke-width="1.8"/>
  <text x="154" y="55" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#6E2933">38°</text>
  <text x="112" y="70" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#166353">60°</text>
  <text x="66" y="118" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#181B20">60 m</text>
  <text x="242" y="152" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#166353">Lamp h</text>
