<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Lighthouse of height h observing ships on opposite sides at 30 and 60 degrees for Exercise 6.3 Q5</title>
  <desc id="desc">Two ships on opposite sides of lighthouse height h viewed at 30 and 60 degrees depression; horizontal distances d1 and d2 are unknown.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="20" y1="186" x2="300" y2="186" stroke="#525B62" stroke-width="1.5"/>
  <line x1="205" y1="90" x2="205" y2="186" stroke="#181B20" stroke-width="2.6"/>
  <line x1="76" y1="90" x2="288" y2="90" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="205" y1="90" x2="38.72" y2="186" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="205" y1="90" x2="260.43" y2="186" stroke="#166353" stroke-width="1.8"/>
  <path d="M163,90 A42,42 0 0,0 168.63,111" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <path d="M239,90 A34,34 0 0,1 222,119.44" fill="none" stroke="#166353" stroke-width="1.3"/>
