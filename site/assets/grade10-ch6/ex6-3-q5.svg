  <text x="249" y="116" font-family="system-ui,sans-serif" font-size="15" font-weight="550" text-anchor="start" fill="#166353">60°</text>
  <text x="192" y="138" transform="rotate(-90 192 138)" font-family="system-ui,sans-serif" font-size="15" font-weight="550" text-anchor="middle" dominant-baseline="central" fill="#181B20">h</text>
  <text x="122" y="209" font-family="system-ui,sans-serif" font-size="15" font-weight="550" text-anchor="middle" fill="#6E2933">d₁</text>
  <text x="233" y="209" font-family="system-ui,sans-serif" font-size="15" font-weight="550" text-anchor="middle" fill="#166353">d₂</text>
</svg>
