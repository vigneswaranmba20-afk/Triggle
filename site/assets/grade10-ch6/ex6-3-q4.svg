  <text x="50" y="115" transform="rotate(-90 50 115)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#181B20">1800 m</text>
  <text x="207" y="203" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6E2933">Boat distance</text>
