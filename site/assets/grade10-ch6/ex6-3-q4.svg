<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Aeroplane at 1800 m observing two boats at 60 and 30 degrees depression for Exercise 6.3 Q4</title>
