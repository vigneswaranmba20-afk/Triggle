<line x1="56.00000" y1="46.00000" x2="302.00000" y2="46.00000" stroke="#706977" stroke-dasharray="4 3"/>
<line x1="56.00000" y1="46.00000" x2="131.05553" y2="176.00000" stroke="#70384b"/>
<line x1="56.00000" y1="46.00000" x2="281.16660" y2="176.00000" stroke="#166353"/>
