  <line x1="24" y1="186" x2="296" y2="186" stroke="#525B62" stroke-width="1.5"/>
  <line x1="66" y1="44" x2="66" y2="186" stroke="#181B20" stroke-width="1.6" stroke-dasharray="3,3"/>
  <line x1="66" y1="44" x2="274" y2="44" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="66" y1="44" x2="146" y2="186" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="66" y1="44" x2="268" y2="186" stroke="#166353" stroke-width="1.8"/>
