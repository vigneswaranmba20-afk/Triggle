<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Flying bird diagram for Unit Exercise 6 Q5</title>
  <desc id="desc">80 m tall tree with bird flying horizontally away; elevation drops from 45 degrees to 30 degrees after 2 seconds.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="188" x2="296" y2="188" stroke="#525B62" stroke-width="1.5"/>
  <line x1="154" y1="188" x2="154" y2="74" stroke="#181B20" stroke-width="2.5"/>
  <line x1="154" y1="74" x2="256" y2="74" stroke="#166353" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="256" y1="74" x2="256" y2="188" stroke="#525B62" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="40" y1="188" x2="154" y2="74" stroke="#6E2933" stroke-width="2"/>
  <line x1="40" y1="188" x2="256" y2="74" stroke="#6E2933" stroke-width="2"/>
  <circle cx="154" cy="74" r="4" fill="#166353"/>
  <circle cx="256" cy="74" r="4" fill="#6E2933"/>
  <path d="M70.0,188.0 A30,30 0 0,0 61.2,166.8" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <path d="M92.0,188.0 A52,52 0 0,0 86.0,163.7" fill="none" stroke="#166353" stroke-width="1.3"/>
  <text x="66" y="146" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="end" fill="#6E2933">45°</text>
  <text x="104" y="180" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#166353">30°</text>
  <text x="167" y="158" transform="rotate(-90 167 158)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#181B20">80 m</text>
  <text x="272" y="131" transform="rotate(-90 272 131)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#525B62">80 m</text>
  <text x="205" y="62" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#166353">Flight (2 s)</text>
</svg>
