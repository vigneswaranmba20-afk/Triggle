<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Flying bird diagram for Unit Exercise 6 Q5</title>
  <desc id="desc">80 m tall tree with bird flying horizontally away; elevation drops from 45 degrees to 30 degrees after 2 seconds.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="188" x2="296" y2="188" stroke="#525B62" stroke-width="1.5"/>
  <line x1="154" y1="188" x2="154" y2="74" stroke="#181B20" stroke-width="2.5"/>
  <line x1="154" y1="74" x2="254" y2="74" stroke="#166353" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="254" y1="74" x2="254" y2="188" stroke="#525B62" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="40" y1="188" x2="154" y2="74" stroke="#6E2933" stroke-width="2"/>
  <line x1="40" y1="188" x2="254" y2="74" stroke="#6E2933" stroke-width="2"/>
  <circle cx="154" cy="74" r="4" fill="#166353"/>
  <circle cx="254" cy="74" r="4" fill="#6E2933"/>
  <text x="86" y="182" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#6E2933">45° / 30°</text>
  <text x="148" y="135" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#181B20">80 m</text>
  <text x="260" y="135" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#525B62">80 m</text>
  <text x="204" y="64" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#166353">Flight (2 s)</text>
</svg>
