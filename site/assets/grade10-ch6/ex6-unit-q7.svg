  <path d="M190.0,150.0 A36,36 0 0,0 167.2,158.1" fill="none" stroke="#525B62" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M160.0,110.0 A32,32 0 0,0 152.7,89.6" fill="none" stroke="#166353" stroke-width="1.3"/>
  <path d="M128.0,84.0 A26,26 0 0,1 148.0,93.4" fill="none" stroke="#525B62" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="200" y="199" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#181B20">A</text>
  <text x="105" y="113" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#6E2933">B</text>
  <text x="230" y="38" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#166353">C</text>
  <text x="199" y="126" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#525B62">N</text>
  <text x="56" y="189" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="end" fill="#525B62">W</text>
  <text x="128" y="16" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#525B62">N</text>
  <text x="284" y="113" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#525B62">E</text>
  <text x="152" y="178" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="end" fill="#6E2933">55°</text>
