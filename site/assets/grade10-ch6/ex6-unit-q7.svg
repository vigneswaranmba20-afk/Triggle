<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Two-leg flight bearing diagram for Unit Exercise 6 Q7</title>
  <desc id="desc">Bird flies 30 km from A to B at 35 degrees West of North (55 degrees from W), then 32 km from B to C on bearing 48 degrees (42 degrees from E).</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="120" y1="186" x2="220" y2="186" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="176" y1="196" x2="176" y2="110" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="118" y1="138" x2="118" y2="46" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="118" y1="126" x2="230" y2="126" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="176" y1="186" x2="118" y2="126" stroke="#6E2933" stroke-width="2.2"/>
  <line x1="118" y1="126" x2="218" y2="54" stroke="#166353" stroke-width="2.2"/>
  <circle cx="176" cy="186" r="4" fill="#181B20"/>
  <circle cx="118" cy="126" r="4" fill="#6E2933"/>
  <circle cx="218" cy="54" r="4" fill="#166353"/>
  <text x="184" y="190" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#181B20">A</text>
  <text x="104" y="128" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#6E2933">B</text>
  <text x="225" y="56" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#166353">C</text>
  <text x="155" y="148" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">30 km (55° N of W)</text>
  <text x="172" y="88" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#166353">32 km (48° N of E / 42°)</text>
</svg>
