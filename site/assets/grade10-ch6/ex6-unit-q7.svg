<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Two-leg flight bearing diagram for Unit Exercise 6 Q7</title>
  <desc id="desc">Bird flies 30 km from A to B at 35 degrees West of North (55 degrees from W), then 32 km from B to C on bearing 48 degrees (42 degrees from E).</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="68" y1="186" x2="210" y2="186" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="190" y1="198" x2="190" y2="122" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="128" y1="126" x2="128" y2="24" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="112" y1="110" x2="274" y2="110" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="190" y1="186" x2="128" y2="110" stroke="#6E2933" stroke-width="2.2"/>
  <line x1="128" y1="110" x2="220" y2="34" stroke="#166353" stroke-width="2.2"/>
  <circle cx="190" cy="186" r="4" fill="#181B20"/>
  <circle cx="128" cy="110" r="4" fill="#6E2933"/>
  <circle cx="220" cy="34" r="4" fill="#166353"/>
