  <title id="t">Building and statue diagram for Unit Exercise 6 Q9</title>
  <desc id="desc">Building of unknown height h1 and statue of unknown height H on opposite sides of a 35 m street; from the roof, elevation to statue top is 24 degrees and depression to base is 34 degrees.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="186" x2="296" y2="186" stroke="#525B62" stroke-width="1.5"/>
