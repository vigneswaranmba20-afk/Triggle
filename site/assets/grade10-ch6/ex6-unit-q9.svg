  <line x1="210" y1="186" x2="210" y2="43" stroke="#166353" stroke-width="3"/>
  <line x1="82" y1="100" x2="210" y2="100" stroke="#525B62" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="82" y1="100" x2="210" y2="43" stroke="#6E2933" stroke-width="2"/>
