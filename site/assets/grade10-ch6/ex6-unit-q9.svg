  <line x1="24" y1="186" x2="296" y2="186" stroke="#525B62" stroke-width="1.5"/>
  <rect x="64" y="114" width="18" height="72" fill="#E6EFEA" stroke="#181B20" stroke-width="1.8"/>
  <line x1="238" y1="186" x2="238" y2="52" stroke="#166353" stroke-width="3"/>
  <line x1="82" y1="114" x2="238" y2="114" stroke="#525B62" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="82" y1="114" x2="238" y2="52" stroke="#6E2933" stroke-width="2"/>
  <line x1="82" y1="114" x2="238" y2="186" stroke="#6E2933" stroke-width="2"/>
