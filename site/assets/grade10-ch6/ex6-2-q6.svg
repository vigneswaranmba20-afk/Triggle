<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">15 m high tower observed from bottom and top of electric pole for Exercise 6.2 Q6</title>
  <desc id="desc">Angle of elevation of top of 15 m tower is 60 degrees from pole foot and 30 degrees from pole top.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="28" y1="190" x2="292" y2="190" stroke="#525B62" stroke-width="1.5"/>
  <line x1="76" y1="100" x2="76" y2="190" stroke="#166353" stroke-width="2.8"/>
  <line x1="244" y1="42" x2="244" y2="190" stroke="#181B20" stroke-width="2.8"/>
  <line x1="76" y1="100" x2="244" y2="100" stroke="#525B62" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="76" y1="190" x2="244" y2="42" stroke="#6E2933" stroke-width="1.8"/>
  <line x1="76" y1="100" x2="244" y2="42" stroke="#166353" stroke-width="1.8"/>
  <text x="64" y="148" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#166353">h</text>
  <text x="252" y="122" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#181B20">15 m</text>
  <text x="252" y="76" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#6E2933">15−h</text>
  <text x="108" y="182" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">60°</text>
  <text x="114" y="95" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#166353">30°</text>
</svg>
