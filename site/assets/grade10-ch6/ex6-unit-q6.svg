<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Aeroplane angle change diagram for Unit Exercise 6 Q6</title>
  <desc id="desc">Aeroplane flying at 600 m altitude approaches ground observer as elevation increases from 37 degrees to 53 degrees.</desc>
  <style>text{paint-order:stroke;stroke:#F7F6F2;stroke-width:3px;stroke-linejoin:round;}</style>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="188" x2="296" y2="188" stroke="#525B62" stroke-width="1.5"/>
  <line x1="154" y1="64" x2="254" y2="64" stroke="#166353" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="154" y1="64" x2="154" y2="188" stroke="#181B20" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="254" y1="64" x2="254" y2="188" stroke="#181B20" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="46" y1="188" x2="254" y2="64" stroke="#6E2933" stroke-width="2"/>
  <line x1="46" y1="188" x2="154" y2="64" stroke="#6E2933" stroke-width="2"/>
  <circle cx="254" cy="64" r="4" fill="#6E2933"/>
  <circle cx="154" cy="64" r="4" fill="#166353"/>
  <path d="M76.0,188.0 A30,30 0 0,0 65.7,165.4" fill="none" stroke="#6E2933" stroke-width="1.3"/>
  <path d="M98.0,188.0 A52,52 0 0,0 90.7,161.4" fill="none" stroke="#166353" stroke-width="1.3"/>
  <text x="121" y="171" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#6E2933">53°</text>
  <text x="110" y="180" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#166353">37°</text>
  <text x="272" y="126" transform="rotate(-90 272 126)" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#181B20">600 m</text>
  <text x="204" y="52" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#166353">175 m/s × t</text>
</svg>
