<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t desc">
  <title id="t">Aeroplane angle change diagram for Unit Exercise 6 Q6</title>
  <desc id="desc">Aeroplane flying at 600 m altitude approaches ground observer as elevation increases from 37 degrees to 53 degrees.</desc>
  <rect width="320" height="220" rx="10" fill="#F7F6F2"/>
  <line x1="24" y1="188" x2="296" y2="188" stroke="#525B62" stroke-width="1.5"/>
  <line x1="158" y1="64" x2="258" y2="64" stroke="#166353" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="158" y1="64" x2="158" y2="188" stroke="#181B20" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="258" y1="64" x2="258" y2="188" stroke="#181B20" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="48" y1="188" x2="258" y2="64" stroke="#6E2933" stroke-width="2"/>
  <line x1="48" y1="188" x2="158" y2="64" stroke="#6E2933" stroke-width="2"/>
  <circle cx="258" cy="64" r="4" fill="#6E2933"/>
  <circle cx="158" cy="64" r="4" fill="#166353"/>
  <text x="84" y="176" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#6E2933">53° / 37°</text>
  <text x="264" y="130" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#181B20">600 m</text>
  <text x="208" y="54" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#166353">175 m/s × t</text>
</svg>
