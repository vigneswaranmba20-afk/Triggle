<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t d">
  <title id="t">சம மூலைவிட்டங்கள் கொண்ட WXYZ செவ்வகம்</title>
  <desc id="d">மேல் இடப்புறம் W, கீழ் இடப்புறம் X, கீழ் வலப்புறம் Y, மேல் வலப்புறம் Z. XZ, YW மூலைவிட்டங்கள் மையத்தில் வெட்டிக்கொள்கின்றன.</desc>
  <style>
    .edge,.accent,.guide {fill:none;stroke-linecap:round;stroke-linejoin:round}
    .edge{stroke:#273349;stroke-width:2.5}.accent{stroke:#155c89;stroke-width:2.6}
    .guide{stroke:#698397;stroke-width:1.4;stroke-dasharray:5 4}
    .mark{fill:none;stroke:#273349;stroke-width:1.5}
    text{fill:#202c40;font:600 14px system-ui,sans-serif;paint-order:stroke;stroke:#f8fafc;stroke-width:3px;stroke-linejoin:round}
    .hint{fill:#57687a;font-size:12px}
  </style>
  <rect width="320" height="220" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="66,37 66,180 256,180 256,37 66,37"/>
  <line class="accent" x1="66" y1="37" x2="256" y2="180"/>
  <line class="accent" x1="66" y1="180" x2="256" y2="37"/>
  <text x="46" y="29">W</text><text x="45" y="199">X</text>
  <text x="261" y="199">Y</text><text x="260" y="29">Z</text>
  <text x="8" y="116" class="hint">b</text><text x="157" y="205" class="hint">a</text>
  <text x="151" y="94" class="hint">XZ = YW</text>
  <text x="9" y="18" class="hint">எதிர்ப்பக்கங்கள் சமம். மூலைவிட்டங்களும் சமம்.</text>
</svg>
