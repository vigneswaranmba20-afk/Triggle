<svg xml:lang="ta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>6 மீ கம்பத்தின் நிழல் 4 மீ. கோபுரத்தின் நிழல் 28 மீ. கம்பமும் கோபுரமும் தம் நிழல்களுடன் செங்கோண முக்கோணங்களை அமைக்கின்றன. ஒளிக்கதிர்கள் ஒரே திசையில் செல்கின்றன.</title>
  <style>
    .edge,.accent,.guide,.mark { fill:none; stroke-linecap:round; stroke-linejoin:round }
    .edge { stroke:#273349; stroke-width:2 }
    .accent { stroke:#155c89; stroke-width:2.5 }
    .guide { stroke:#62778a; stroke-width:1.4; stroke-dasharray:5 4 }
    .mark { stroke:#465369; stroke-width:1.4 }
    .point { fill:#273349 }
    text { fill:#202c40; font:600 15px system-ui,sans-serif; paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round }
  </style>
  <rect width="320" height="180" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="39.000,127.000 39.000,52.000 89.000,127.000 39.000,127.000"/>
<polyline class="edge" points="124.000,127.000 124.000,31.000 188.000,127.000 124.000,127.000"/>
<polyline class="mark" points="39.000,118.000 48.000,118.000 48.000,127.000"/>
<polyline class="mark" points="124.000,118.000 133.000,118.000 133.000,127.000"/>
<text x="10.000" y="93.000">6 m</text>
<text x="26.000" y="151.000">4 m</text>
<text x="112.000" y="89.000">H</text>
<text x="130.000" y="151.000">28 m</text>
