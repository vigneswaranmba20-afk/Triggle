<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="t d">
  <title id="t">Rectangle WXYZ with equal diagonals</title>
  <desc id="d">W at bottom left, X at bottom right, Y at top right and Z at top left. Equal diagonals XZ and YW meet at the centre.</desc>
  <rect x="48" y="42" width="216" height="90" rx="0.5" fill="#f6f3fa" stroke="#272836" stroke-width="2"/>
  <path d="M264 132L48 42 M264 42L48 132" fill="none" stroke="#166353" stroke-width="1.65" stroke-dasharray="5 3"/>
  <g fill="#272836" font-family="system-ui,sans-serif" font-size="16" font-weight="550" text-anchor="middle">
    <text x="34" y="39">Z</text><text x="280" y="39">Y</text>
    <text x="34" y="147">W</text><text x="280" y="147">X</text>
    <text x="156" y="153">a</text><text x="282" y="92">b</text>
    <text x="156" y="23">XZ = YW</text>
  </g>
</svg>
