<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t d">
  <title id="t">Sarah to James: two roads compared with a direct road</title>
  <desc id="d">A right triangle: B Street is 2 miles along the bottom, A Street is 1.5 miles up the right side, and C Street is the direct diagonal connecting the houses.</desc>
  <style>
    .edge,.accent,.guide {fill:none;stroke-linecap:round;stroke-linejoin:round}
    .edge{stroke:#273349;stroke-width:2.5}.accent{stroke:#155c89;stroke-width:2.6}
    .guide{stroke:#698397;stroke-width:1.4;stroke-dasharray:5 4}
    .mark{fill:none;stroke:#273349;stroke-width:1.5}
    text{fill:#202c40;font:600 14px system-ui,sans-serif;paint-order:stroke;stroke:#f8fafc;stroke-width:3px;stroke-linejoin:round}
    .hint{fill:#57687a;font-size:12px}
  </style>
  <rect width="320" height="220" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="53,179 249,179 249,32"/>
  <line class="accent" x1="53" y1="179" x2="249" y2="32"/>
  <polyline class="mark" points="235,179 235,165 249,165"/>
  <circle cx="53" cy="179" r="3" fill="#273349"/><circle cx="249" cy="32" r="3" fill="#273349"/>
  <text x="9" y="202">Sarah</text><text x="238" y="24">James</text>
  <text x="151" y="202" text-anchor="middle">B Street · 2 miles</text>
  <text x="108" y="110" transform="rotate(-36.87 108 110)">C Street</text>
  <text x="240" y="108" text-anchor="end">A Street</text><text x="240" y="132" text-anchor="end" class="hint">1.5 miles</text>
</svg>
