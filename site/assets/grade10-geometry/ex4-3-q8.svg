<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t d">
  <title id="t">Right triangle ABC with BC trisected</title>
  <desc id="d">B is the right-angle corner. D and E divide BC into three equal parts BD, DE, EC. Segments AD, AE and AC connect to the top vertex A.</desc>
  <style>
    .edge,.accent,.guide {fill:none;stroke-linecap:round;stroke-linejoin:round}
    .edge{stroke:#273349;stroke-width:2.5}.accent{stroke:#155c89;stroke-width:2.6}
    .guide{stroke:#698397;stroke-width:1.4;stroke-dasharray:5 4}
    .mark{fill:none;stroke:#273349;stroke-width:1.5}
    text{fill:#202c40;font:600 14px system-ui,sans-serif;paint-order:stroke;stroke:#f8fafc;stroke-width:3px;stroke-linejoin:round}
    .hint{fill:#57687a;font-size:12px}
  </style>
  <rect width="320" height="220" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="68,31 68,185 281,185 68,31"/>
  <line class="accent" x1="68" y1="31" x2="139" y2="185"/>
  <line class="accent" x1="68" y1="31" x2="210" y2="185"/>
  <polyline class="mark" points="68,171 82,171 82,185"/>
  <line class="mark" x1="100" y1="179" x2="100" y2="191"/>
  <line class="mark" x1="171" y1="179" x2="171" y2="191"/>
  <line class="mark" x1="242" y1="179" x2="242" y2="191"/>
  <text x="48" y="24">A</text><text x="48" y="204">B</text>
  <text x="133" y="206">D</text><text x="205" y="206">E</text><text x="281" y="204">C</text>
  <text class="hint" x="9" y="113">AB</text>
  <text class="hint" x="110" y="167">t</text><text class="hint" x="182" y="167">t</text><text class="hint" x="253" y="167">t</text>
</svg>
