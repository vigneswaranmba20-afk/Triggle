<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 213" role="img">
  <title>Quadrilateral with two angle bisectors</title>
  <style>
    .edge,.accent,.guide,.mark { fill:none; stroke-linecap:round; stroke-linejoin:round }
    .edge { stroke:#273349; stroke-width:2 }
    .accent { stroke:#155c89; stroke-width:2.5 }
    .guide { stroke:#62778a; stroke-width:1.4; stroke-dasharray:5 4 }
    .mark { stroke:#465369; stroke-width:1.4 }
    .point { fill:#273349 }
    text { fill:#202c40; font:600 15px system-ui,sans-serif; paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round }
  </style>
  <rect width="320" height="213" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="145.000,23.000 37.000,105.000 166.000,184.000 253.000,105.000 145.000,23.000 166.000,184.000"/>
<polyline class="guide" points="37.000,105.000 253.000,105.000"/>
<polyline class="edge" points="145.000,23.000 95.707,140.952"/>
<polyline class="edge" points="145.000,23.000 213.407,140.952"/>
<polyline class="accent" points="95.707,140.952 213.407,140.952"/>
<circle class="point" cx="145.000" cy="23.000" r="2.200"/><text x="140.000" y="14.000">A</text>
<circle class="point" cx="37.000" cy="105.000" r="2.200"/><text x="24.000" y="107.000">B</text>
<circle class="point" cx="166.000" cy="184.000" r="2.200"/><text x="163.000" y="202.000">C</text>
<circle class="point" cx="253.000" cy="105.000" r="2.200"/><text x="260.000" y="108.000">D</text>
<circle class="point" cx="95.707" cy="140.952" r="2.200"/><text x="77.707" y="146.952">E</text>
<circle class="point" cx="213.407" cy="140.952" r="2.200"/><text x="221.407" y="147.952">F</text>
</svg>
