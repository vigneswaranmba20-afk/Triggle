<circle class="point" cx="95.000" cy="52.706" r="2.200"/><text x="86.000" y="43.706">P</text>
<circle class="point" cx="289.000" cy="165.000" r="2.200"/><text x="289.000" y="184.000">R</text>
<circle class="point" cx="224.000" cy="52.706" r="2.200"/><text x="225.000" y="43.706">S</text>
<circle class="point" cx="159.500" cy="90.041" r="2.200"/><text x="155.500" y="81.041">T</text>
