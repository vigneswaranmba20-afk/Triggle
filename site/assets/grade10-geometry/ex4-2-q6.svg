<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 193" role="img">
  <title>Three parallel lines across a trapezium</title>
  <style>
    .edge,.accent,.guide,.mark { fill:none; stroke-linecap:round; stroke-linejoin:round }
    .edge { stroke:#273349; stroke-width:2 }
    .accent { stroke:#155c89; stroke-width:2.5 }
    .guide { stroke:#62778a; stroke-width:1.4; stroke-dasharray:5 4 }
    .mark { stroke:#465369; stroke-width:1.4 }
    .point { fill:#273349 }
    text { fill:#202c40; font:600 15px system-ui,sans-serif; paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round }
  </style>
  <rect width="320" height="193" rx="8" fill="#f8fafc"/>
  <polyline class="edge" points="56.000,31.000 247.000,31.000 286.000,156.000 28.000,156.000 56.000,31.000"/>
<polyline class="guide" points="56.000,31.000 286.000,156.000"/>
<polyline class="accent" points="42.280,92.250 266.110,92.250"/>
<circle class="point" cx="56.000" cy="31.000" r="2.200"/><text x="46.000" y="22.000">A</text>
<circle class="point" cx="247.000" cy="31.000" r="2.200"/><text x="248.000" y="22.000">B</text>
<circle class="point" cx="286.000" cy="156.000" r="2.200"/><text x="287.000" y="175.000">C</text>
<circle class="point" cx="28.000" cy="156.000" r="2.200"/><text x="19.000" y="175.000">D</text>
<circle class="point" cx="42.280" cy="92.250" r="2.200"/><text x="26.280" y="94.250">E</text>
<circle class="point" cx="266.110" cy="92.250" r="2.200"/><text x="274.110" y="95.250">F</text>
<circle class="point" cx="168.700" cy="92.250" r="2.200"/><text x="172.700" y="85.250">X</text>
</svg>
