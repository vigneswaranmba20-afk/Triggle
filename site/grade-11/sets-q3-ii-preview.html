<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Triggle Grade 11 · Exercise 1.1 Q3(ii)</title><style>
:root{font:16px/1.6 system-ui,sans-serif;color:#173c35;background:#f4f8f5}*{box-sizing:border-box}main{max-width:760px;margin:auto;padding:18px}header{background:#17483e;color:white;border-radius:16px;padding:20px}article{background:white;border:1px solid #c8dcd3;border-radius:14px;padding:20px;margin:16px 0}button{font:inherit;padding:9px 15px;margin:8px 8px 8px 0;border-radius:9px;border:2px solid #286856;background:white;color:#173c35;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #bd710b;outline-offset:3px}li{margin:12px 0}#error{color:#a22}summary{cursor:pointer;font-weight:700}p,li{overflow-wrap:anywhere}</style></head><body><main><header><h1 id="heading">Grade 11 · Exercise 1.1 · Question 3(ii)</h1></header><nav aria-label="Lesson language"><button id="en" aria-pressed="true">English</button><button id="ta" aria-pressed="false" lang="ta">தமிழ்</button></nav><p id="review">Tamil human editorial review pending · testing preview</p><p id="error" role="alert"></p><button id="retry" hidden>Retry</button><section id="lesson" aria-label="Worked solution"></section><footer><p>2025 revised textbooks: English Volume I p. 7 (PDF p. 15); Tamil Volume I p. 9 (PDF p. 17). © Triggle.</p></footer></main>
<script>
'use strict';let lang='en',data=null;const byId=id=>document.getElementById(id);const node=(tag,value)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n;};
function render(){document.documentElement.lang=lang;byId('en').setAttribute('aria-pressed',String(lang==='en'));byId('ta').setAttribute('aria-pressed',String(lang==='ta'));byId('heading').textContent=lang==='en'?'Grade 11 · Exercise 1.1 · Question 3(ii)':'வகுப்பு 11 · பயிற்சி 1.1 · வினா 3(ii)';byId('review').textContent=lang==='en'?'Tamil human editorial review pending · testing preview':'தமிழ் மனித ஆசிரியர் மதிப்பாய்வு நிலுவையில் உள்ளது · சோதனை முன்னோட்டம்';byId('retry').textContent=lang==='en'?'Retry':'மீண்டும் முயல்க';byId('lesson').replaceChildren();if(!data)return;const q=data.questions[0];const card=node('article');card.append(node('h2',q.prompt[lang]));const details=node('details');details.append(node('summary',lang==='en'?'Show step-by-step solution':'படிப்படியான தீர்வைக் காண்க'));const list=node('ol');q.steps[lang].forEach(s=>list.append(node('li',s)));details.append(list,node('p',(lang==='en'?'Answer: ':'விடை: ')+q.answer[lang]));card.append(details);byId('lesson').append(card);}
function switchLang(next){lang=next;render();if(!data&&!byId('retry').hidden)byId('error').textContent=lang==='en'?'Lesson unavailable. Retry.':'பாடம் கிடைக்கவில்லை. மீண்டும் முயல்க.';}
byId('en').addEventListener('click',()=>switchLang('en'));byId('ta').addEventListener('click',()=>switchLang('ta'));
async function load(){byId('retry').hidden=true;byId('error').textContent='';try{const response=await fetch('../data/textbook-exercises/g11-ch1-ex1-1-q3-ii.json');if(!response.ok)throw Error('HTTP');const d=await response.json();const q=d.questions?.[0];if(d.grade!==11||d.exercise!=='1.1'||d.questions.length!==1||q.id!=='g11-ch1-ex1.1-q3-ii'||q.review?.mathematics!=='independently checked'||q.source?.page?.en!==7||q.source?.page?.ta!==9||!q.steps?.en?.length||!q.steps?.ta?.length||!q.prompt?.en||!q.prompt?.ta||!q.answer?.en||!q.answer?.ta)throw Error('Invalid lesson');data=d;render();}catch(e){byId('error').textContent=lang==='en'?'Lesson unavailable. Retry.':'பாடம் கிடைக்கவில்லை. மீண்டும் முயல்க.';byId('retry').hidden=false;}}
byId('retry').addEventListener('click',load);load();
</script></body></html>
