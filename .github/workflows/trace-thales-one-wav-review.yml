name: TRACE Mission 05 — Thales visual and ONE Fola WAV review

# PR runs mathematical QA and synthetic visual preview; dispatch imports real user WAV.
# This workflow NEVER creates a public student-facing video or uses paid AI models.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/tools/trace_video_factory.py'
      - 'site/tools/trace_thales_artwork.py'
      - 'site/tools/test_trace_thales_video.py'
      - 'site/tools/test_trace_thales_one_wav.py'
      - 'site/tools/trace_one_wav_recording_sheet.py'
      - 'site/video-factory/lessons/g10-ch4-bpt-thales.json'
      - 'docs/trace/THALES_ONE_SHOT_FOLA_RECORDING_SHEET.md'
      - '.github/workflows/trace-thales-one-wav-review.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      single_wav_url:
        description: 'GitHub issue attachment URL of ONE nine-scene recorded WAV, with 8 deliberately long pauses'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trace-thales-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  math-and-one-wav-tests:
    name: Verify exact theorem, original transfer, mobile geometry and silence importer
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-API math/voice/source QA
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_thales_video.py
          python3 site/tools/test_trace_thales_one_wav.py
          python3 site/tools/test_trace_single_wav_import.py
          python3 site/tools/trace_video_factory.py self-test --lesson g10-ch4-bpt-thales
          python3 site/tools/trace_one_wav_recording_sheet.py \
            --lesson g10-ch4-bpt-thales \
            --output docs/trace/THALES_ONE_SHOT_FOLA_RECORDING_SHEET.md --check

  visual-preview:
    name: Review all nine animated triangles at 360px with placeholder audio
    needs: math-and-one-wav-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline frame/rendering dependencies (no AI API)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python3 -m pip install -r site/video-factory/requirements.txt
      - name: Render nine geometric story scenes on narrow Android viewport
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_thales_video.py
          python3 site/tools/trace_video_factory.py render \
            --lesson g10-ch4-bpt-thales --mode demo \
            --width 360 --height 640 --fps 6 \
            --cache build/trace-video/thales-demo-cache \
            --output build/trace-video/thales-demo-qa
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/trace-video/thales-demo-qa')
          res=json.loads((root/'result.json').read_text())
          assert res['lessonId']=='g10-ch4-bpt-thales'
          assert res['mode']=='demo' and res['reviewRequired'] and res['publishable'] is False
          assert res['width']==360 and res['height']==640
          assert len(res['beats'])==9
          assert (root/res['videoFile']).stat().st_size>50_000
          print('PASS source-verified nine-geometry-scene technical preview; synthetic audio only')
          PY
      - name: Preserve technical preview for QA only
        uses: actions/upload-artifact@v4
        with:
          name: thales-nine-scene-geometry-tech-demo-${{ github.run_id }}
          path: |
            build/trace-video/thales-demo-qa/*.mp4
            build/trace-video/thales-demo-qa/result.json
          retention-days: 7
          if-no-files-found: error

  real-fola-review:
    name: Split one verified Fola WAV, render nine synced scenes, private preview only
    if: github.event_name == 'workflow_dispatch' && github.actor == 'vigneswaranmba20-afk'
    needs: math-and-one-wav-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LESSON: g10-ch4-bpt-thales
      WAV_URL: ${{ inputs.single_wav_url }}
      WAV_DIR: build/trace-video/thales-one-wav
      OUTPUT_DIR: build/trace-video/thales-one-wav-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert only the actual owner-recorded WAV to nine validated scene files
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/trace_single_wav_import.py \
            --lesson "$LESSON" --url "$WAV_URL" --output "$WAV_DIR"
      - name: Install offline renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python3 -m pip install -r site/video-factory/requirements.txt
      - name: Render exact Thales geometry with real recorded speech
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_thales_video.py
          python3 site/tools/trace_video_factory.py render \
            --lesson "$LESSON" --mode existing --existing-dir "$WAV_DIR" \
            --width 720 --height 1280 --fps 12 \
            --cache build/trace-video/thales-real-cache \
            --output "$OUTPUT_DIR"
      - name: Check all nine scenes, eight separator boundaries and review gate
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          voice=Path(os.environ['WAV_DIR'])
          out=Path(os.environ['OUTPUT_DIR'])
          manifest=json.loads((voice/'voice-pack-manifest.json').read_text())
          video=json.loads((out/'result.json').read_text())
          assert manifest['lessonId']==video['lessonId']=='g10-ch4-bpt-thales'
          assert manifest['source']=='one-user-supplied-continuous-WAV'
          assert manifest['alignmentMethod']=='eight-verified-long-silence-separators'
          assert len(manifest['detectedSeparatorSeconds'])==8
          assert len(manifest['beats'])==len(video['beats'])==9
          assert manifest['releaseApproved'] is False and manifest['reviewRequired']
          assert manifest['noModelApiCalls']
          assert video['reviewRequired'] and video['mode']=='existing'
          assert video['width']==720 and video['height']==1280
          assert (out/video['videoFile']).stat().st_size>50_000
          print('PASS one WAV -> nine Thales scenes. HUMAN AUDIO/MATH/MOBILE APPROVAL REQUIRED.')
          PY
      - name: Save private review output (no Cloudflare or GitHub Pages publication)
        uses: actions/upload-artifact@v4
        with:
          name: trace-thales-one-wav-private-review-${{ github.run_id }}
          path: |
            build/trace-video/thales-one-wav-review/*.mp4
            build/trace-video/thales-one-wav-review/result.json
            build/trace-video/thales-one-wav/voice-pack-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Release safeguards
        run: |
          echo 'Thales owner recording assembled for HUMAN REVIEW ONLY.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No cloud video publication and no Gemini/OpenAI model API requests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Silence checks do not verify the spoken transcript or Fola identity.' >> "$GITHUB_STEP_SUMMARY"
