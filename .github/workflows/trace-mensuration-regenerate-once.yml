name: TRACE Mensuration branch-only status regeneration

on:
  push:
    branches: [trace/g10-mensuration-consolidated-20261125]
    paths: [.github/workflows/trace-mensuration-regenerate-once.yml]

permissions:
  contents: read

concurrency:
  group: trace-mensuration-regenerate-once
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'vigneswaranmba20-afk/Triggle' && github.ref == 'refs/heads/trace/g10-mensuration-consolidated-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the canonical public curriculum projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/trace/g10-mensuration-consolidated-20261125'
          npm run status:build
          npm run status:check
          if ! git diff --quiet; then
            test "$(git diff --name-only)" = 'site/data/project-status.json'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- site/data/project-status.json
            git commit -m 'Regenerate Mensuration release curriculum projection'
            git push origin HEAD:refs/heads/trace/g10-mensuration-consolidated-20261125
          fi
          npm run status:check
      - name: Run the three new exercise source and mathematics checks
        run: |
          node site/tools/test_g10_ch7_ex74.cjs
          node site/tools/test_g10_ch7_ex75.cjs
          node site/tools/test_g10_ch7_unit7.cjs
