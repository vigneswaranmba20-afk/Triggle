name: AUD08-06 strict KaTeX currency probe
on:
  push:
    branches:
      - audit-fix/aud08-06-currency-variance-reviewed-20261122
    paths:
      - site/tools/aud08-06-katex-probe.cjs
      - .github/workflows/aud08-06-katex-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/tools/aud08-06-katex-probe.cjs
