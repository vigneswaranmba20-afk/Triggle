name: Regenerate Class 10 coverage status snapshot (temporary)
on:
  push:
    branches: [feat/g10-why-comprehensive-20261114]
    paths: ['.github/workflows/tmp-g10-why-coverage-status-2.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g10-why-comprehensive-20261114
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/tools/build_project_status.cjs
      - name: Push regenerated source projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(status): regenerate after final Class 10 content corrections'
            git push origin HEAD:feat/g10-why-comprehensive-20261114
          fi
