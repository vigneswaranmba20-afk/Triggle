name: TRACE regenerate source-derived status (temporary)
on:
  push:
    branches:
      - integration/g10-ex27-after-ex28-ex29-20261118
    paths:
      - .github/workflows/trace-regenerate-status-temporary.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/g10-ex27-after-ex28-ex29-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run status:build
      - name: Commit source-generated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(trace): regenerate source-derived curriculum status"
            git push origin HEAD:refs/heads/integration/g10-ex27-after-ex28-ex29-20261118
          fi
