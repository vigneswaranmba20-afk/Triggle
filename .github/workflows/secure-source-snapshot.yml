name: VER Triggle one-time full source backup
on:
  push:
    branches:
      - backup/secure-snapshot-2026-11-19
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source, ALL branches, tags, history, and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git archive --format=zip --output=backup/Triggle-source-main-2d519657.zip 2d519657cdb09e479ceb8181d905119220d7101c
          git bundle create backup/Triggle-ALL-branches-history-2026-11-19.bundle --all
          (cd backup && sha256sum Triggle-source-main-2d519657.zip Triggle-ALL-branches-history-2026-11-19.bundle > SHA256SUMS.txt)
          git bundle verify backup/Triggle-ALL-branches-history-2026-11-19.bundle
          git for-each-ref --format='%(refname)' refs/remotes/origin/ > backup/BACKED_UP_BRANCH_REFS.txt
          test "$(wc -l < backup/BACKED_UP_BRANCH_REFS.txt)" -gt 10
      - name: Upload durable Drive-transfer package
        uses: actions/upload-artifact@v4
        with:
          name: VER-Triggle-source-all-branches-2026-11-19
          path: backup/*
          retention-days: 7
          if-no-files-found: error
