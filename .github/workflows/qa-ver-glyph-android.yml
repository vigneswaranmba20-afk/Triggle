name: VER Glyph Android Chrome QA

on:
  push:
    branches: [qa/ver-glyph-android]

permissions:
  contents: read

jobs:
  android:
    name: Test the staged picker in Chrome on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Stage the production-format student build
        shell: bash
        run: |
          git rev-parse HEAD
          git diff --exit-code cb627389aa1ac29b8e2906ef17349e2bb8f8ba06 -- site/assets site/data site/index.html site/service-worker.js
          mkdir -p "$RUNNER_TEMP/triggle-android-stage" "$RUNNER_TEMP/triggle-android-evidence"
          cp -a site/. "$RUNNER_TEMP/triggle-android-stage/"
          node site/tools/build_student_release.cjs "$RUNNER_TEMP/triggle-android-stage"
      - name: Boot an Android 15 emulator with Chrome
        shell: bash
        run: |
          set -euo pipefail
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          cmdline_bin="$(dirname "$sdkmanager")"
          export PATH="$cmdline_bin:$ANDROID_HOME/platform-tools:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          image='system-images;android-35;google_apis_playstore;x86_64'
          "$sdkmanager" --install "$image" emulator platform-tools
          echo no | avdmanager create avd --force --name triggle-qa --package "$image"
          "$ANDROID_HOME/emulator/emulator" -avd triggle-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/triggle-android-evidence/emulator.log" 2>&1 &
          timeout 240 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system font_scale 1.0
          adb shell pm list packages com.android.chrome | tr -d '\r' | grep -Fx 'package:com.android.chrome'
          adb shell am set-debug-app --persistent com.android.chrome
          adb shell dumpsys package com.android.chrome | awk '/versionName/ && !shown++'
      - name: Run all five widths with separate 200% text scaling
        shell: bash
        run: |
          set -euo pipefail
          export TRIGGLE_ANDROID_STAGE="$RUNNER_TEMP/triggle-android-stage"
          export TRIGGLE_SELECTION_SCREENSHOTS="$RUNNER_TEMP/triggle-android-evidence"
          node site/tools/test_selection_dialogs_browser.cjs 2>&1 | tee "$TRIGGLE_SELECTION_SCREENSHOTS/results.txt"
      - name: Save Android QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ver-glyph-android-chrome
          path: ${{ runner.temp }}/triggle-android-evidence
          retention-days: 14
