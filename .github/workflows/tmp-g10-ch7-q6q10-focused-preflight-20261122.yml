name: Temporary G10 Ch7 Q6-Q10 focused preflight
on:
  push:
    branches:
      - feature/g10-ch7-ex71-q6-q10-conveyor-20261122
    paths-ignore:
      - site/data/project-status.json
permissions:
  contents: write
concurrency:
  group: g10-ch7-q6q10-focused-preflight
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Refresh source-derived public curriculum status
        run: npm run status:build
      - name: Fast exact-source and mathematical preflight
        run: |
          node site/tools/test_g10_ch7_ex71_q6_q10_draft.cjs
          node site/tools/test_standard_solutions.cjs
          npm run status:check
      - name: Install Chromium headless shell for three mobile sizes
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run dedicated 320, 390 and 412 pixel mobile QA
        run: node site/tools/test_g10_ch7_ex71_q6_q10_mobile_browser.cjs
      - name: Preserve new allowlisted source-derived project status
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(g10): refresh public status for source-checked Mensuration Q6-Q10"
            git push origin HEAD:feature/g10-ch7-ex71-q6-q10-conveyor-20261122
          fi
