# Owner-approved 16 Nov 2026, 10/10 original Gemini-narrated lesson.
# Launch exactly one checksum-bound R2 upload + quality-gated website release.
# This push trigger runs only upon addition of this specific file to main.
name: TRACE approved geometric-series video — Cloudflare release once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trace-approved-gp-sum-once.yml

permissions:
  actions: write
  contents: read

jobs:
  start-gp-release:
    name: Dispatch exact reviewed GP video for R2 and Triggle
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch reviewed SHA-256 locked publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run trace-video-publish.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_run_id=43828579902 \
            -f lesson=g10-ch2-gp-sum \
            -f approved_sha256=cbb3e46ec0c1cd7637bfcd3d623b459893ad772fe31d3b6f8b93f6ca4ea0f4db
          echo "Dispatched exact reviewed GP MP4 from run 43828579902."
