name: TRACE G.P. — recorded WAV to real video (zero model API)

# ChatGPT-reviewed script + Gemini AI Studio WAVs -> actual synced MP4.
# Manual-only: no TTS requests, no paid model API, no automatic publication.
on:
  workflow_dispatch:
    inputs:
      voice_zip_url:
        description: 'HTTPS GitHub issue attachment URL for ZIP of nine Gemini-recorded WAV files'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: trace-gp-recorded-wav-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-review-only:
    name: Validate recorded narration and assemble nine-scene MP4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LESSON: g10-ch2-gp-sum
      VOICE_ZIP_URL: ${{ inputs.voice_zip_url }}
      VOICE_DIR: build/trace-video/imported-gp-wavs
      REVIEW_DIR: build/trace-video/gp-real-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offline security, voice configuration and exact-maths checks
        run: |
          python3 site/tools/test_trace_voice_pack_import.py
          python3 site/tools/test_trace_voice_policy.py
          python3 site/tools/test_trace_fola_voice.py
          python3 site/tools/test_trace_gp_video.py
          python3 site/tools/trace_video_factory.py self-test --lesson "$LESSON"

      - name: Import and validate user-recorded WAV pack (no Gemini API)
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY
          python3 site/tools/trace_voice_pack_import.py \
            --lesson "$LESSON" \
            --url "$VOICE_ZIP_URL" \
            --output "$VOICE_DIR"

      - name: Install local-only mathematics animation renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python3 -m pip install -r site/video-factory/requirements.txt

      - name: Assemble actual narrated 9-scene G.P. MP4
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY
          python3 site/tools/trace_video_factory.py render \
            --lesson "$LESSON" --mode existing --existing-dir "$VOICE_DIR" \
            --width 720 --height 1280 --fps 12 \
            --cache build/trace-video/gp-import-render-cache \
            --output "$REVIEW_DIR"

      - name: Verify video and preserve mandatory human review gate
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["REVIEW_DIR"])
          result = json.loads((output / "result.json").read_text())
          provenance = json.loads((Path(os.environ["VOICE_DIR"]) / "voice-pack-manifest.json").read_text())
          assert result["mode"] == "existing", "Must not call any model API"
          assert result["lessonId"] == "g10-ch2-gp-sum"
          assert result["reviewRequired"] is True
          assert result["width"] == 720 and result["height"] == 1280
          assert len(result["beats"]) == len(provenance["beats"]) == 9
          assert provenance["noModelApiCalls"] and not provenance["releaseApproved"]
          assert (output / result["videoFile"]).is_file()
          print("PASS review-only real-audio MP4. Fola identity, math timing and visual QA still require approval.")
          PY

      - name: Upload private review MP4 and voice provenance (no R2 publication)
        uses: actions/upload-artifact@v4
        with:
          name: trace-gp-real-voice-review-${{ github.run_id }}
          path: |
            build/trace-video/gp-real-review/*.mp4
            build/trace-video/gp-real-review/result.json
            build/trace-video/imported-gp-wavs/voice-pack-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Explain this release boundary
        run: |
          echo 'A real, externally narrated MP4 is attached for REVIEW ONLY.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Zero Gemini/ChatGPT API calls were made by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check pronunciation, Fola voice identity, algebra, alignment and Android readability.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO automatic R2 upload or live student-facing changes.' >> "$GITHUB_STEP_SUMMARY"
