name: TRACE Video Factory — approved publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful TRACE preview run ID (Gemini, final 720x1280)
        type: string
        required: true
      lesson:
        description: The lesson being approved
        type: choice
        required: true
        default: g10-ch2-ap-sum
        options:
          - g10-ch2-ap-sum
      approved_sha256:
        description: Exact 64-character MP4 SHA-256 shown in preview run summary
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: trace-video-approved-publish
  cancel-in-progress: false

jobs:
  publish-approved-only:
    name: Validate approval, upload to R2, and request quality-gated release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check approval inputs
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]{8,16}$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo 'Expected full lower-case SHA-256'; exit 1; }
      - name: Retrieve exact owner-reviewed Gemini preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          VIDEO_LESSON: ${{ inputs.lesson }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "trace-video-${VIDEO_LESSON}-gemini-${SOURCE_RUN}" \
            --dir build/trace-video/release
      - name: Install FFprobe for approved-media verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify fingerprint, math-scene order, resolution, codecs and provenance
        env:
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
          VIDEO_LESSON: ${{ inputs.lesson }}
        run: |
          python3 site/tools/trace_video_release.py verify \
            --lesson "$VIDEO_LESSON" \
            --result build/trace-video/release/result.json \
            --sha "$APPROVED_SHA"
      - name: Confirm required private R2 upload credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for v in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "Missing GitHub Actions secret: $v"; exit 1; }
          done
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || exit 1
          [[ "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9-]+$ ]] || exit 1
          [[ "$R2_PUBLIC_BASE_URL" == https://* ]] || { echo 'Public R2 base URL must be HTTPS'; exit 1; }
      - name: Upload approved immutable MP4 to Cloudflare R2
        id: upload
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
          VIDEO_LESSON: ${{ inputs.lesson }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null; then python3 -m pip install awscli; fi
          KEY="trace-videos/${VIDEO_LESSON}/${APPROVED_SHA}.mp4"
          FILE="build/trace-video/release/${VIDEO_LESSON}-gemini.mp4"
          URL="${R2_PUBLIC_BASE_URL%/}/${KEY}"
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp "$FILE" "s3://${R2_BUCKET}/${KEY}" --content-type video/mp4
          curl --fail --silent --show-error --location --retry 2 --max-time 90 --range 0-1023 "$URL" -o /tmp/trace-r2-range-check
          test -s /tmp/trace-r2-range-check
          echo "public_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded exact approved SHA-256 to immutable R2 object key."
      - name: Create reviewable website update in a PR, never push directly to main
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.upload.outputs.public_url }}
          VIDEO_LESSON: ${{ inputs.lesson }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          DURATION="$(python3 -c "import json;print(json.load(open('build/trace-video/release/result.json'))['durationSeconds'])")"
          python3 site/tools/trace_video_release.py register \
            --lesson "$VIDEO_LESSON" --url "$PUBLIC_URL" --duration "$DURATION"
          BRANCH="video/trace-approved-${SOURCE_RUN}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g10-ch2-concepts.js
          git diff --cached --quiet && { echo 'No difference to publish'; exit 1; }
          git commit -m "Publish owner-approved TRACE narration for ${VIDEO_LESSON}"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "Publish approved TRACE video: ${VIDEO_LESSON}" \
            --body "Reviewed preview run: ${SOURCE_RUN}; exact SHA-256: ${APPROVED_SHA}. Uploaded to R2. Requires Triggle quality gate before merging.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"
          # GITHUB_TOKEN-triggered PRs do not start PR Actions automatically.
          # workflow_dispatch is a documented exception, validating this exact HEAD.
          gh workflow run smart-ci.yml --ref "$BRANCH"
          gh pr merge --auto --squash "$PR_URL"
      - name: Show approved publication handoff
        if: success()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          echo "## TRACE release approval submitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved media uploaded to R2. The website changes only after its required quality gate passes." >> "$GITHUB_STEP_SUMMARY"
          echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
