name: TRACE approved Fola Geometric Series release — once
on:
  push:
    branches: [main]
    paths: [.github/workflows/trace-gp-fola-release-once.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: trace-gp-fola-publish
  cancel-in-progress: false

env:
  LESSON: g10-ch2-gp-sum
  SHA: b89073380f066247805c5b1ba5def43522c6424c36d731bc26973120c5438ab3

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve exactly approved MP4 and verify video+audio
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/video/g10-gp-fola-stage-20261117
          mkdir -p build/trace-video/release
          git show FETCH_HEAD:build/trace-video/staged/g10-ch2-gp-sum-fola-b8907338.mp4 > build/trace-video/release/g10-ch2-gp-sum-gemini.mp4
          echo "${SHA}  build/trace-video/release/g10-ch2-gp-sum-gemini.mp4" | sha256sum -c -
          test "$(stat -c %s build/trace-video/release/g10-ch2-gp-sum-gemini.mp4)" = 2321989
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import json,subprocess
          p='build/trace-video/release/g10-ch2-gp-sum-gemini.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name,width,height','-of','json',p]))
          assert abs(float(d['format']['duration'])-93.0)<0.2
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' and s.get('width')==720 and s.get('height')==1280 for s in d['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in d['streams'])
          print('PASS verified 93s 720x1280 H264/AAC owner-approved Fola video')
          PY

      - name: Upload exactly verified bytes to existing Cloudflare R2
        id: upload
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          for v in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "Missing previously configured secret ${v}"; exit 1; }
          done
          [[ "${R2_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]
          [[ "${R2_PUBLIC_BASE_URL}" == https://* ]]
          if ! command -v aws >/dev/null; then python3 -m pip install --quiet awscli; fi
          KEY="trace-videos/${LESSON}/${SHA}.mp4"
          URL="${R2_PUBLIC_BASE_URL%/}/${KEY}"
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp build/trace-video/release/g10-ch2-gp-sum-gemini.mp4 "s3://${R2_BUCKET}/${KEY}" --content-type video/mp4
          curl --fail --silent --show-error --location --retry 2 --max-time 90 --range 0-1023 "${URL}" -o /tmp/gp-fola-public-check
          test -s /tmp/gp-fola-public-check
          echo "public_url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Open website video-only PR, dispatch quality gate and enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.upload.outputs.public_url }}
        run: |
          set -euo pipefail
          grep -q 'cbb3e46ec0c1cd7637bfcd3d623b459893ad772fe31d3b6f8b93f6ca4ea0f4db' site/data/g10-ch2-concepts.js || { echo 'Source video changed; refusing stale overwrite'; exit 1; }
          python3 site/tools/trace_video_release.py register --lesson "${LESSON}" --url "${PUBLIC_URL}" --duration 93.0
          node site/tools/build_project_status.cjs
          BRANCH="video/gp-fola-approved-${GITHUB_RUN_ID}"
          git switch -c "${BRANCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g10-ch2-concepts.js site/data/project-status.json
          git diff --cached --quiet && { echo 'No change to publish'; exit 1; }
          git commit -m 'Publish approved Fola Geometric Series video'
          git push origin "${BRANCH}"
          PR_URL="$(gh pr create --base main --head "${BRANCH}" --title 'Publish Fola narration for Grade 10 geometric series' --body "Exact 93s reviewed MP4 SHA-256 ${SHA}, uploaded to Cloudflare R2 and public range verified. Changes only G.P. video URL and source-derived status. Requires Triggle quality gate.")"
          echo "PR: ${PR_URL}"
          gh workflow run smart-ci.yml --ref "${BRANCH}"
          gh pr merge --auto --squash "${PR_URL}"
