name: Copy approved G9 distance lesson to Cloudflare R2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/g9-distance-r2-upload.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g9-distance-r2-exact-media
  cancel-in-progress: false
jobs:
  exact-media-to-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIDEO: site/videos/triggle-g9-distance-formula-en.mp4
      SHA: 8ada907f59bf11788bad196fc8e3ec876de4bc5d98caef53fa50368d78277323
      EXPECTED_SIZE: '2031309'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-approved original media and codecs
        run: |
          set -euo pipefail
          test "$(stat -c %s "$VIDEO")" = "$EXPECTED_SIZE"
          echo "$SHA  $VIDEO" | sha256sum --check -
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg; fi
          python3 - <<'PY'
          import json,os,subprocess
          x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'format=duration,size:stream=codec_type,codec_name','-of','json',os.environ['VIDEO']]))
          assert int(x['format']['size'])==int(os.environ['EXPECTED_SIZE'])
          assert abs(float(x['format']['duration'])-75.6)<0.5
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' for s in x['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in x['streams'])
          print('PASS exact approved 75.6-second narrated MP4')
          PY
      - name: Upload immutable MP4 and verify public R2 range playback
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name}" || { echo "Missing R2 secret: $name"; exit 1; }
          done
          PUBLIC="${R2_PUBLIC_BASE_URL%/}"
          test "$PUBLIC" = 'https://pub-ed71b86e97a64b428086e292b26fb7a2.r2.dev'
          [[ "$R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          command -v aws >/dev/null || python3 -m pip install --quiet awscli
          KEY="trace-videos/g9-ch5-distance-formula/$SHA.mp4"
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --endpoint-url "$ENDPOINT" s3 cp "$VIDEO" "s3://$R2_BUCKET/$KEY" \
            --content-type video/mp4 --cache-control 'public, max-age=31536000, immutable' --no-progress
          SIZE="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --query ContentLength --output text)"
          test "$SIZE" = "$EXPECTED_SIZE"
          URL="$PUBLIC/$KEY"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --range 0-1023 --dump-header /tmp/g9-r2-headers "$URL" -o /tmp/g9-r2-prefix
          cmp -n 1024 "$VIDEO" /tmp/g9-r2-prefix
          grep -Eiq '^HTTP/[0-9.]+ 206([[:space:]]|$)' /tmp/g9-r2-headers
          echo "PASS Cloudflare R2 exact MP4, HTTP 206 range, and matching bytes"
          echo "Verified R2 video: $URL" >> "$GITHUB_STEP_SUMMARY"
