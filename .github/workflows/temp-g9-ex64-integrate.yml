name: TEMP AUD14 Grade 9 seven-question source generator
on:
  push:
    branches: [audit-fix/g9-ex64-q2q3-integration-20261122]
    paths:
      - '.github/workflows/temp-g9-ex64-integrate.yml'
permissions:
  contents: write
jobs:
  generate-approved-content:
    if: "!contains(github.event.head_commit.message, 'remove temporary AUD14 generator')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exactly seven source-pinned English question records and all projections
        run: node site/tools/ci/gen_aud14_02_seven_release.cjs
      - name: Verify no new scripts outside approved paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          node site/tools/build_g9_math.cjs --check
          node site/tools/test_standard_solutions.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_g9_ex64_q2_q3_stage.cjs
      - name: Commit only scoped release files to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/service-worker.js \
            site/data/textbook-exercises/g9-ch6-ex6-4-q2-q3-en.js \
            site/data/g9-clear-math.js site/data/problem-difficulty.js \
            site/data/project-status.json \
            site/tools/test_standard_solutions.cjs \
            site/tools/test_g9_clear_math.cjs \
            site/tools/test_g9_ex64_q2_q3_stage.cjs \
            docs/audit/AUD14_02_EX64_Q2_Q3_RELEASE_EVIDENCE.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(aud14): stage seven source-pinned Grade 9 Ex6.4 reader records"
          git push origin "HEAD:refs/heads/audit-fix/g9-ex64-q2q3-integration-20261122"
