name: AUD13-02 regenerate certified Grade 9 math projection (one-shot)

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/g9-distance-formula-aud13-02-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate source-derived math rendering (no stale preservation)
        run: node site/tools/build_g9_math.cjs
      - name: Commit only regenerated math presentation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g9-clear-math.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(aud13-02): regenerate Grade 9 MathML from corrected steps'
          fi
          node site/tools/build_project_status.cjs
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(aud13-02): synchronize source-derived project status'
          fi
      - name: Verify deterministic source projection
        run: |
          node site/tools/build_g9_math.cjs --check
          node site/tools/build_project_status.cjs --check
          node site/tools/test_g9_ch5_aud13_02.cjs
      - name: Push generated artifacts to the same feature branch
        shell: bash
        run: git push origin HEAD:audit-fix/g9-distance-formula-aud13-02-20261122
