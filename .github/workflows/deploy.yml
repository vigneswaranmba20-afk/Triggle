
name: Publish Triggle from source

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  actions: read
  id-token: write

concurrency:
  group: triggle-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import the current website once
        shell: bash
        run: |
          if [ ! -f site/index.html ]; then
            mkdir -p site
            unzip -q Triggle_v124_Complete_Website.zip -d site
            python3 - <<'PY'
          from pathlib import Path
          p=Path('site/assets/app.js')
          t=p.read_text(encoding='utf-8')
          start=t.index('   let s=esc(str).replace(/')
          end=t.index('\n   s=s.replace(/([²³⁴])',start)
          patch=r'''   let s=esc(str);
             s=s.replace(/\(\s*\[\[([^\]|]+)\|([^\]]+)\]\]\s*\)([²³⁴])/g,
               (_m,n,d,p)=>stash('<math xmlns="http://www.w3.org/1998/Math/MathML" class="mathml-brackets"><mstyle displaystyle="true"><msup><mrow><mo stretchy="true">(</mo><mfrac><mtext>'+n+'</mtext><mtext>'+d+'</mtext></mfrac><mo stretchy="true">)</mo></mrow><mn>'+({'²':2,'³':3,'⁴':4}[p])+'</mn></msup></mstyle></math>'));
             s=s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(_m,n,d)=>stash('<span class="frac"><span>'+esc(n)+'</span><span>'+esc(d)+'</span></span>'));'''
          t=t[:start]+patch+t[end:]
          p.write_text(t,encoding='utf-8')
          css=Path('site/assets/app.css')
          css.write_text(css.read_text(encoding='utf-8')+'\n.mathml-brackets{display:inline-block;vertical-align:middle;font-size:1.4em;white-space:nowrap;margin:0 .07em}\n',encoding='utf-8')
          html=Path('site/index.html')
          html.write_text(html.read_text(encoding='utf-8').replace('?v=127','?v=128').replace('v1.27','v1.28'),encoding='utf-8')
          sw=Path('site/service-worker.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('triggle-shell-v1.27','triggle-shell-v1.28'),encoding='utf-8')
          PY
            node --check site/assets/app.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f site/
            git commit -m "Store Triggle v1.28 as editable source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate website files
        shell: bash
        run: |
          test -s site/index.html
          test -s site/grades.html
          test -s site/playground.html
          node --check site/assets/app.js
          node site/tools/check_site.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Legacy main-root Pages and the Actions artifact must expose identical URLs.
      # Keep the maintained app at /site/ and publish only its public entry redirects.
      - name: Stage the canonical Pages layout
        run: |
          mkdir -p _pages/site _pages/dashboard
          cp -a site/. _pages/site/
          node site/tools/build_student_release.cjs _pages/site
          cp index.html teacher-review.html _pages/
          cp dashboard/index.html _pages/dashboard/
          test -s _pages/site/dashboard/index.html
          test -s _pages/site/teacher-review.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pages

      # Give the Actions artifact service and the Pages deployment lookup time
      # to converge. Run-attempt-specific names avoid collisions on job reruns.
      - name: Wait for Pages artifact indexing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          last_id=""
          for attempt in $(seq 1 18); do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "'"${PAGES_ARTIFACT}"'" and .expired == false and .size_in_bytes > 0) | .id] | join(",")')
            if [[ "$ids" =~ ^[0-9]+$ && "$ids" == "$last_id" ]]; then
              echo "PASS: a single stable Pages artifact indexed: $ids"
              # A successful REST lookup alone was not sufficient on run 45527962080.
              # Allow the separate deploy-pages artifact lookup to catch up.
              sleep 20
              exit 0
            fi
            last_id="$ids"
            echo "::notice::Waiting for stable Pages artifact (attempt $attempt/18)"
            sleep 5
          done
          echo "::error::Pages artifact indexing did not settle to one stable item" >&2
          exit 1

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify freshly deployed Pages source
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vigneswaranmba20-afk.github.io/Triggle/site"
          # Compare bytes of the published learning content as well as the shell.
          # A successful HTML/SW check alone cannot detect stale Grade 9 maths.
          files=(
            index.html
            service-worker.js
            data/class-9.js
            data/textbook-exercises/g9-ch6-ex6-4-q2-q3-en.js
            data/g9-clear-math.js
            data/textbook-exercises/g10-ch7-ex7-4.js
            data/textbook-exercises/g10-ch7-ex7-5.js
            data/textbook-exercises/g10-ch7-unit7.js
            assets/app.js
          )
          for asset in _pages/site/assets/student-*.*.*; do
            files+=("${asset#_pages/site/}")
          done
          for attempt in $(seq 1 18); do
            matching=1
            for file in "${files[@]}"; do
              mkdir -p "/tmp/triggle-live/$(dirname "$file")"
              if ! curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
                   "$BASE/$file?sha=$GITHUB_SHA" -o "/tmp/triggle-live/$file" ||
                 ! cmp -s "_pages/site/$file" "/tmp/triggle-live/$file"; then
                matching=0
                echo "::notice::Pages asset mismatch on attempt $attempt: $file"
                break
              fi
            done
            if (( matching )); then
              echo "PASS: Pages shell, chapter packs, service worker and canonical reference assets match staged commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Published Pages student assets never matched validated commit" >&2
          exit 1
