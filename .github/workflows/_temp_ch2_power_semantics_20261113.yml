name: Temporary Chapter 2 power semantics browser preflight
on:
  push:
    branches: [fix/g10-all-chapters-chatgpt-maths-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check 4k² in true KaTeX semantic MathML
        run: node site/tools/test_g10_ch2_power_baseline_browser.cjs
