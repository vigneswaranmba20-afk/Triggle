name: TRACE Dual Intelligence — offline pilot rehearsal

on:
  push:
    branches: [feature/trace-dual-first-pilot-rehearsal-20261117]
    paths: [.github/workflows/trace-dual-rehearsal.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  grade10-synthetic-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact series and mocked two-model review tests
        run: |
          node site/tools/bulk/test_trace_dual_rehearsal.cjs
          node site/tools/bulk/test_trace_dual_ai.cjs
          node site/tools/bulk/test_trace_dual_evidence.cjs
      - name: Produce a reproducible, zero-cost report
        run: |
          node site/tools/bulk/trace_dual_rehearsal.cjs --output build/trace/dual-rehearsal.json
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('build/trace/dual-rehearsal.json','utf8'));
          if(result.total!==12||result.exactMatched!==10||result.locallyRejected!==2||
             result.providerMockCalls!==20||result.actualProviderCalls!==0||result.releaseApproved!==false)
            throw Error('REHEARSAL_EVIDENCE_GATE_FAILED');
          const summary='## TRACE dual-AI pilot rehearsal\n\n'+
            '| Measure | Verified |\n|---|---:|\n'+
            '| Synthetic GP cases | '+result.total+' |\n'+
            '| Exact arithmetic matches | '+result.exactMatched+' |\n'+
            '| Wrong answers rejected before AI | '+result.locallyRejected+' |\n'+
            '| Mock provider responses | '+result.providerMockCalls+' |\n'+
            '| Actual provider API calls | 0 |\n'+
            '| Additional API spend | $0 |\n\n'+
            '**Not a real AI review or textbook-source certification. No student release.**\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
      - name: Upload transparent pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: trace-dual-offline-pilot-report
          path: build/trace/dual-rehearsal.json
          retention-days: 14
          if-no-files-found: error
