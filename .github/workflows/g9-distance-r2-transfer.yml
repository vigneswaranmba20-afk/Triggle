name: Transfer approved Grade 9 distance video to Cloudflare R2

# One-time, exact-hash transfer from already reviewed repository media.
# Trigger only when this workflow is first merged onto main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g9-distance-r2-transfer.yml'

permissions:
  contents: read

concurrency:
  group: triggle-g9-distance-r2-transfer-8ada907f
  cancel-in-progress: false

jobs:
  upload-verified-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VIDEO: site/videos/triggle-g9-distance-formula-en.mp4
      EXPECTED_SHA256: 8ada907f59bf11788bad196fc8e3ec876de4bc5d98caef53fa50368d78277323
      EXPECTED_BYTES: '2031309'
      OBJECT_KEY: trace-videos/g9-ch5-distance-formula/8ada907f59bf11788bad196fc8e3ec876de4bc5d98caef53fa50368d78277323.mp4
      APPROVED_PUBLIC_BASE: https://pub-ed71b86e97a64b428086e292b26fb7a2.r2.dev
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact previously reviewed Fola MP4 before remote writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' "$VIDEO")" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  $VIDEO" | sha256sum --check -
          grep -Fq "$EXPECTED_SHA256" site/data/g9-ch5-distance-concept.js
          grep -Fq "./videos/triggle-g9-distance-formula-en.mp4" site/data/g9-ch5-distance-concept.js
          echo 'PASS exact approved local 75.6-second MP4 source and lesson provenance'

      - name: Upload exact hash-pinned object to existing Cloudflare R2 bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for var in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!var}" || { echo "::error::Missing configured R2 secret: $var"; exit 1; }
          done
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          test "${R2_PUBLIC_BASE_URL%/}" = "$APPROVED_PUBLIC_BASE"
          if ! command -v aws >/dev/null; then python3 -m pip install --quiet awscli; fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$ENDPOINT" s3 cp "$VIDEO" "s3://$R2_BUCKET/$OBJECT_KEY" --content-type video/mp4 --no-progress
          SIZE="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$OBJECT_KEY" --query 'ContentLength' --output text)"
          test "$SIZE" = "$EXPECTED_BYTES"
          TYPE="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$OBJECT_KEY" --query 'ContentType' --output text)"
          test "$TYPE" = video/mp4
          echo 'PASS exact R2 object stored with video/mp4 content type and approved size'

      - name: Verify Cloudflare public byte-range streaming before site switch
        shell: bash
        run: |
          set -euo pipefail
          URL="$APPROVED_PUBLIC_BASE/$OBJECT_KEY"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 30 --range 0-1023 \
                --dump-header /tmp/g9-r2-headers "$URL" --output /tmp/g9-r2-prefix; then
              if grep -Eq '^HTTP/[0-9.]+ 206([[:space:]]|$)' /tmp/g9-r2-headers &&
                  cmp -n 1024 "$VIDEO" /tmp/g9-r2-prefix; then
                echo 'PASS Cloudflare R2 exact first 1024 bytes and HTTP 206 range playback'
                echo "Verified URL: $URL" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Cloudflare did not serve exact approved video with byte-range support'
          exit 1
