name: AUD14-03 one-shot Grade 9 source-choice projection
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
permissions:
  contents: write
jobs:
  source-projection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/aud14-03-g9-ex61-ex65-options-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate only two deterministic Grade 9 projections
        run: |
          node site/tools/build_g9_math.cjs
          node site/tools/build_project_status.cjs
      - name: Validate source and every immutable-source correction
        run: |
          node site/tools/build_g9_math.cjs --check
          node site/tools/build_project_status.cjs --check
          node site/tools/test_g9_aud14_03_source_options.cjs
          node site/tools/test_standard_solutions.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_why_step_g9.cjs
          node site/tools/validate_curriculum.cjs
      - name: Commit only generated source-derived assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g9-clear-math.js site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(aud14-03): synchronize Grade 9 source-choice math and public status'
            git push origin HEAD:audit-fix/aud14-03-g9-ex61-ex65-options-20261122
          fi
