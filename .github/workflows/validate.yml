name: Validate curriculum and Pages source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.56.1 supports this LTS image; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: ''
      - name: Keep a mobile screenshot of the revised Grade 10 question reader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-reader-grade10-q5
          path: screenshots/adaptive-reader-grade10-q5-390.png
          if-no-files-found: ignore
