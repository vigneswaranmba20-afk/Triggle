name: Validate curriculum and Pages source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.56.1 supports this LTS image; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify private Firestore rules in the emulator
        run: npm run test:security
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: ''
      - name: Verify retired dashboard redirect and teacher flows in WebKit
        run: npm run test:webkit
      - name: Keep a mobile screenshot of the revised Grade 10 question reader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-reader-grade10-q5
          path: screenshots/adaptive-reader-grade10-q5-390.png
          if-no-files-found: ignore
      - name: Archive Class 10 Why-step Cartesian grid mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-why-step-q4-mobile
          path: screenshots/g10-why-q4-390.png
          if-no-files-found: ignore
