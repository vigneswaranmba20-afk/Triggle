name: EVOLVE Neon audit repair — proposals only
on:
  push:
    branches: [experiment/evolve-shadow-v1-20261122]
    paths:
      - experiments/evolve/audit_fix_aud08_06.mjs
      - experiments/evolve/hf_oidc_auth_probe.mjs
      - experiments/evolve/hf_oidc_auth_probe.test.mjs
      - experiments/evolve/hf_two_case_evidence_policy.mjs
      - experiments/evolve/hf_two_case_evidence_policy.test.mjs
      - experiments/evolve/hf_two_case_evidence_trial.mjs
      - experiments/evolve/run_two_audits_20261123.txt
      - experiments/evolve/hf_five_audit_benchmark.mjs
      - experiments/evolve/run_five_audits_20261123.txt
      - .github/workflows/evolve-audit-repair.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AUD08-06 mathematical safety checks
        run: node experiments/evolve/audit_fix_aud08_06.mjs --self-test
      - name: OIDC protocol safety tests (no live identity calls)
        run: node --test experiments/evolve/hf_oidc_auth_probe.test.mjs
      - name: Approved inference one-shot safety tests
        run: node --test experiments/evolve/hf_one_call_safety.test.mjs
      - name: Hand-authored offline proposal only
        run: node experiments/evolve/audit_fix_aud08_06.mjs --dry-run
      - name: Archive untrusted patch for independent review
        uses: actions/upload-artifact@v4
        with:
          name: evolve-aud08-06-unreviewed-patch
          path: |
            ${{ runner.temp }}/evolve-aud08-06-proposed.js
            ${{ runner.temp }}/evolve-aud08-06-evidence.json
          retention-days: 7
  oidc-proof:
    # Disabled until account CI/CD identity and the GitHub repository variable are configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: evolve-hf-lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exchange a short-lived account identity token only
        env:
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
        run: node experiments/evolve/hf_oidc_auth_probe.mjs --probe

  one-model-audit-trial:
    # A uniquely named one-shot head commit opts in; normal branch pushes never infer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && github.event.head_commit.message == 'EVOLVE_POSTSUB_APPROVED_20261122_QWEN3_CODER' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    environment: evolve-hf-lab
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check maths and model response constraints
        run: node experiments/evolve/audit_fix_aud08_06.mjs --self-test
      - name: Verify approval gate before any metered request
        run: node --test experiments/evolve/hf_one_call_safety.test.mjs
      - name: Run exactly one approved metered Hugging Face request
        env:
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
          HF_MODEL: Qwen/Qwen3-Coder-30B-A3B-Instruct:amazon-bedrock
          HF_INFER_APPROVED: EVOLVE-AUD08-06-ONE-CALL-20261122
        run: node experiments/evolve/audit_fix_aud08_06.mjs --infer-once
      - name: Archive model result without production write
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-aud08-06-real-model-trial
          path: |
            ${{ runner.temp }}/evolve-aud08-06-proposed.js
            ${{ runner.temp }}/evolve-aud08-06-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  five-audit-hf-pro-benchmark:
    # ONLY a uniquely approved one-use push may spend Hugging Face compute credits.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && github.event.head_commit.message == 'EVOLVE_PRO_FIVE_AUDITS_APPROVED_20261123' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    environment: evolve-hf-lab
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout isolated keyless experiment code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: lab
      - name: Checkout immutable production source baseline (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 8ca60d0aaaae07011017cb9f321713c141a48ba2
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable baseline and five case preflight (zero model calls)
        env:
          TRIGGLE_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          test "$(git -C source rev-parse HEAD)" = '8ca60d0aaaae07011017cb9f321713c141a48ba2'
          node lab/experiments/evolve/hf_five_audit_benchmark.mjs --dry-run
      - name: Exactly five or fewer individually reviewed model calls, no source writes
        env:
          TRIGGLE_SOURCE_ROOT: ${{ github.workspace }}/source
          TRIGGLE_SOURCE_SHA: 8ca60d0aaaae07011017cb9f321713c141a48ba2
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
          HF_MODEL: Qwen/Qwen3-Coder-30B-A3B-Instruct:amazon-bedrock
          HF_INFER_APPROVED: EVOLVE-PRO-FIVE-AUDITS-20261123
        run: node lab/experiments/evolve/hf_five_audit_benchmark.mjs --infer-once
      - name: Archive untrusted model proposals (no tokens, no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-hf-pro-five-audit-proposals
          path: ${{ runner.temp }}/evolve-five-audit-benchmark.json
          if-no-files-found: ignore
          retention-days: 7


  two-audit-evidence-rerun:
    # One-run user-authorized rerun; no open-ended scheduler.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && github.event.head_commit.message == 'EVOLVE_HF_TWO_AUDITS_APPROVED_20261123' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    environment: evolve-hf-lab
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout experiment (without persistent write token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: lab
      - name: Checkout immutable main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 8ca60d0aaaae07011017cb9f321713c141a48ba2
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic evidence and hallucination guard tests
        env:
          TRIGGLE_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          test "$(git -C source rev-parse HEAD)" = '8ca60d0aaaae07011017cb9f321713c141a48ba2'
          node --test lab/experiments/evolve/hf_two_case_evidence_policy.test.mjs
          node lab/experiments/evolve/hf_two_case_evidence_trial.mjs --preflight
      - name: Exactly two OIDC-authorized Hugging Face inference calls
        env:
          TRIGGLE_SOURCE_ROOT: ${{ github.workspace }}/source
          TRIGGLE_SOURCE_SHA: 8ca60d0aaaae07011017cb9f321713c141a48ba2
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
          HF_MODEL: Qwen/Qwen3-Coder-30B-A3B-Instruct:amazon-bedrock
          HF_INFER_APPROVED: EVOLVE-HF-TWO-RETRY-20261123
        run: node lab/experiments/evolve/hf_two_case_evidence_trial.mjs --infer-once
      - name: Verify immutable source checkout remains unmodified
        if: always()
        run: |
          git -C source diff --exit-code
          git -C lab diff --exit-code
      - name: Archive model outputs and explicit rejection reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-hf-two-case-grounded-rerun
          path: ${{ runner.temp }}/evolve-two-case-evidence.json
          if-no-files-found: ignore
          retention-days: 7
