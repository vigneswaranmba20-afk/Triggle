name: EVOLVE Neon audit repair — proposals only
on:
  push:
    branches: [experiment/evolve-shadow-v1-20261122]
    paths:
      - experiments/evolve/audit_fix_aud08_06.mjs
      - experiments/evolve/hf_oidc_auth_probe.mjs
      - experiments/evolve/hf_oidc_auth_probe.test.mjs
      - .github/workflows/evolve-audit-repair.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AUD08-06 mathematical safety checks
        run: node experiments/evolve/audit_fix_aud08_06.mjs --self-test
      - name: OIDC protocol safety tests (no live identity calls)
        run: node --test experiments/evolve/hf_oidc_auth_probe.test.mjs
      - name: Hand-authored offline proposal only
        run: node experiments/evolve/audit_fix_aud08_06.mjs --dry-run
      - name: Archive untrusted patch for independent review
        uses: actions/upload-artifact@v4
        with:
          name: evolve-aud08-06-unreviewed-patch
          path: |
            ${{ runner.temp }}/evolve-aud08-06-proposed.js
            ${{ runner.temp }}/evolve-aud08-06-evidence.json
          retention-days: 7
  oidc-proof:
    # Disabled until account CI/CD identity and the GitHub repository variable are configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: evolve-hf-lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exchange a short-lived account identity token only
        env:
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
        run: node experiments/evolve/hf_oidc_auth_probe.mjs --probe

  one-model-audit-trial:
    # A uniquely named one-shot head commit opts in; normal branch pushes never infer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/evolve-shadow-v1-20261122' && github.event.head_commit.message == 'EVOLVE_ONE_CALL_APPROVED_20261122_QWEN3_CODER' && vars.EVOLVE_HF_USERNAME != ''
    runs-on: ubuntu-24.04
    environment: evolve-hf-lab
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check maths and model response constraints
        run: node experiments/evolve/audit_fix_aud08_06.mjs --self-test
      - name: Run exactly one approved metered Hugging Face request
        env:
          EVOLVE_HF_USERNAME: ${{ vars.EVOLVE_HF_USERNAME }}
          HF_MODEL: Qwen/Qwen3-Coder-30B-A3B-Instruct:amazon-bedrock
          HF_INFER_APPROVED: EVOLVE-AUD08-06-ONE-CALL-20261122
        run: node experiments/evolve/audit_fix_aud08_06.mjs --infer-once
      - name: Archive model result without production write
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-aud08-06-real-model-trial
          path: |
            ${{ runner.temp }}/evolve-aud08-06-proposed.js
            ${{ runner.temp }}/evolve-aud08-06-evidence.json
          if-no-files-found: ignore
          retention-days: 7
