name: Exact Geometry project status verification
on:
  push:
    branches: [verify/g9-geometry-status-01501b5]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01501b5fd5fe29dfda9efdfe1885a1421e70936a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact generated status
        run: |
          git rev-parse HEAD
          if ! npm run status:check; then
            npm run status:build
            git diff --stat
            git diff -- site/data/project-status.json
            exit 1
          fi
