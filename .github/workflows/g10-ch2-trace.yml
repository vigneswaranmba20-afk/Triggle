name: Grade 10 Chapter 2 TRACE learning release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/assets/g10-ch2-*'
      - 'site/assets/chapter-hub.js'
      - 'site/data/g10-ch2-concepts.js'
      - 'site/tools/test_g10_ch2_*'
      - 'site/service-worker.js'
      - '.github/workflows/g10-ch2-trace.yml'

concurrency:
  group: g10-ch2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  grade10-ch2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate exact coverage and source arithmetic
        run: |
          node site/tools/test_g10_ch2_trace.cjs
          node site/tools/test_g10_ch2_trace_release.cjs
      - run: npx playwright install --with-deps chromium
      - name: Validate student-facing English and Tamil concepts at mobile widths
        run: node site/tools/test_g10_ch2_trace_browser.cjs
      - name: Validate Grade 10 Exercise 2.4 source, KaTeX and textbook-order navigation at mobile widths
        run: node site/tools/test_g10_ch2_ex2_4_browser.cjs
