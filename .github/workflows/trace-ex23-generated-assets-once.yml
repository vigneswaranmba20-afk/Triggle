# One-time generated-asset rebuild for source-audited Grade 9 Exercise 2.3.
# Intended only for the isolated feature branch; remove this workflow before release.
name: TRACE Ex2.3 isolated generated asset build
on:
  push:
    branches:
      - trace/g9-ch2-ex2-3-audit-20261117
    paths:
      - .github/workflows/trace-ex23-generated-assets-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    name: Regenerate G9 maths presentation and project-status source hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trace/g9-ch2-ex2-3-audit-20261117
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deterministically rebuild math presentation
        run: node site/tools/build_g9_math.cjs
      - name: Generate public curriculum status
        run: npm run status:build
      - name: Verify exact textbook proof, reproducible maths and status
        run: |
          node docs/curriculum/grade-9/tests/ex2-3-source-audit-math.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_g9_math_compiler.cjs
          npm run status:check
      - name: Commit only canonical generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/g9-clear-math.js site/data/project-status.json
          if git diff --cached --quiet; then
            echo "Generated outputs already current."
          else
            git commit -m "build(g9): regenerate Ex2.3 why-step maths and project status"
            git push origin "HEAD:trace/g9-ch2-ex2-3-audit-20261117"
          fi
