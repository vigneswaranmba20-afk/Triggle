name: Test Triggle changes

on:
  pull_request:
    paths:
      - 'site/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and test site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite
        run: npm test
      - name: Check app JavaScript syntax
        run: node --check site/assets/app.js
