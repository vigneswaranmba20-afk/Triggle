name: TEMP — regenerate derived public project status after G9 source correction
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-g9-ex64-status-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/g9-ex64-q2q3-clean-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recompute all source-derived public status values
        run: node site/tools/build_project_status.cjs
      - name: Validate public status and exact seven-source admission
        run: |
          node site/tools/test_project_status.cjs
          node site/tools/test_g9_ex64_q2_q3_stage.cjs
          node site/tools/build_g9_math.cjs --check
      - name: Commit the single generated status snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          test "$(git diff --cached --name-only)" = 'site/data/project-status.json'
          git commit -m 'ci(status): refresh G9 Ex6.4 public source hashes after copy fix'
          git push origin HEAD:${{ github.head_ref }}
