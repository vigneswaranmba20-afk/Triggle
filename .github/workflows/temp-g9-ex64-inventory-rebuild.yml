name: TEMP — rebuild G9 Ex6.4 curriculum-aware project status
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-g9-ex64-inventory-rebuild.yml'
permissions:
  contents: write
jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/g9-ex64-q2q3-rebased-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate separately approved textbook IDs against curriculum schema and runtime
        run: node site/tools/validate_curriculum.cjs
      - name: Regenerate public project status from merged G9 and G10 source
        run: node site/tools/build_project_status.cjs
      - name: Verify source navigation 16/16, official maths and original source hashes
        run: |
          node site/tools/test_project_status.cjs
          node site/tools/test_g9_ex64_q2_q3_stage.cjs
          node site/tools/test_standard_solutions.cjs
          node site/tools/build_g9_math.cjs --check
      - name: Commit only regenerated public status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          test "$(git diff --cached --name-only)" = 'site/data/project-status.json'
          git commit -m 'ci(status): include all seven G9 Ex6.4 parts in 2025 textbook inventory'
          git push origin HEAD:${{ github.head_ref }}
