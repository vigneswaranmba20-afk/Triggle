name: TRACE Discriminant — reviewed media release adapter tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/tools/trace_discriminant_release.py'
      - 'site/tools/test_trace_discriminant_release.py'
      - 'site/assets/chapter-hub.js'
      - '.github/workflows/trace-discriminant-approved-publish.yml'
      - '.github/workflows/trace-discriminant-release-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reviewed-release-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact SHA, approved R2 URL, one-concept and mobile cache changes
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_discriminant_release.py
          node --check site/assets/chapter-hub.js
      - name: Confirm media never bundled into the site or API expenses authorized
        run: |
          test ! -e site/videos/g10-ch3-discriminant.mp4
          echo 'PASS: reviewed MP4 will only be staged from owner attachment after exact SHA-256/codec/decode checks.'
          echo 'PASS: no Gemini/OpenAI TTS calls, no direct website edits or skipped quality gate.'
