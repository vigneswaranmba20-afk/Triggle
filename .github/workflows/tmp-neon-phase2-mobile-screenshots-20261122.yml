name: Temporary Neon Phase 2 final source + mobile screenshot evidence
on:
  push:
    branches:
      - feature/g10-ch7-ex71-q6-q10-conveyor-20261122
permissions:
  contents: write
  actions: read
jobs:
  capture-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh approved source-derived status and enforce math/source parity
        run: |
          npm run status:build
          npm run status:check
          node site/tools/test_g10_ch7_ex71_q6_q10_draft.cjs
          node site/tools/test_standard_solutions.cjs
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Render actual 15 student viewports and capture DOM assertions
        run: |
          node <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {chromium}=require('playwright');
          const {server,launchOptions}=require('./site/tools/dashboard_test_support.cjs');
          (async()=>{
            const out='/tmp/g10-neon-ui-evidence';fs.mkdirSync(out,{recursive:true});
            const app=await server();let browser;const cases=[];
            try{
              browser=await chromium.launch(launchOptions());
              for(const width of [320,390,412]){
                const ctx=await browser.newContext({viewport:{width,height:820},isMobile:true,hasTouch:true,serviceWorkers:'block',reducedMotion:'reduce',deviceScaleFactor:1});
                const p=await ctx.newPage();const errors=[];const httpErrors=[];
                p.on('pageerror',e=>errors.push(e.message));
                p.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpErrors.push(String(r.status())+' '+r.url());});
                for(const n of [6,7,8,9,10]){
                  const id='c10-7-ex7-1-q'+n;
                  await p.goto(app.base+'/index.html?class=10&question='+id,{waitUntil:'load'});
                  await p.locator('#lessonCard:not([hidden])').waitFor({timeout:10000});
                  await p.locator('#stepsList .katex').first().waitFor({state:'visible',timeout:10000});
                  await p.evaluate(()=>document.fonts.ready);
                  const metrics=await p.evaluate(()=>{
                    const q=document.querySelector('#questionText'),a=document.querySelector('#answerText'),lesson=document.querySelector('#lessonCard');
                    const img=lesson?.querySelector('img');
                    const rect=img?.getBoundingClientRect();
                    return {question:q?.innerText.trim(),answer:a?.innerText.trim(),viewportWidth:innerWidth,documentWidth:document.documentElement.scrollWidth,stepMathCount:lesson?.querySelectorAll('#stepsList .katex').length,answerMathExists:!!a?.querySelector('.katex'),katexErrors:lesson?.querySelectorAll('.katex-error,[data-math-error]').length||0,figure:img?{src:img.getAttribute('src'),naturalWidth:img.naturalWidth,complete:img.complete,bounds:rect?{x:rect.x,y:rect.y,width:rect.width,height:rect.height}:null}:null};
                  });
                  assert.ok(metrics.question?.length>35&&metrics.answer?.length>4,'Question/answer unavailable '+id);
                  assert.ok(metrics.stepMathCount>=4&&metrics.answerMathExists&&metrics.katexErrors===0,'KaTeX unavailable '+id);
                  assert.ok(metrics.documentWidth<=metrics.viewportWidth+1,'Horizontal overflow '+id+' '+width);
                  if(n===10)assert.ok(metrics.figure?.complete&&metrics.figure.naturalWidth>0,'Q10 SVG broken');
                  const filename='g10-ex71-q'+n+'-'+width+'px-fullpage.png';
                  const full=path.join(out,filename);
                  await p.screenshot({path:full,fullPage:true,animations:'disabled'});
                  cases.push({id,width,...metrics,screenshot:filename,screenshotSha256:crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex')});
                  console.log('PASS screenshot '+id+' '+width+'px, '+metrics.stepMathCount+' KaTeX fragments, doc width='+metrics.documentWidth);
                }
                assert.deepEqual(errors,[],'JS errors at '+width);
                assert.deepEqual(httpErrors,[],'HTTP missing assets at '+width);
                await ctx.close();
              }
              fs.writeFileSync(path.join(out,'browser-evidence.json'),JSON.stringify({sourceCommit:process.env.GITHUB_SHA||'',browser:'Chromium',browserVersion:browser.version(),source:'GitHub Actions runner local site',readOnly:true,independentNeonExecution:false,cases},null,2)+'\n');
              assert.equal(cases.length,15);
            }finally{if(browser)await browser.close();await app.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Zip screenshots and browser evidence for offline Neon inspection
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          base=Path('/tmp/g10-neon-ui-evidence')
          dest=Path('/tmp/Triggle_PR338_15_Mobile_Screenshots.zip')
          files=sorted(base.glob('*'))
          assert len(list(base.glob('*.png')))==15,'15 separate mobile screenshots required'
          with ZipFile(dest,'w',compression=ZIP_DEFLATED,compresslevel=7) as z:
            for f in files:z.write(f,arcname=f.name)
          with ZipFile(dest) as z:assert z.testzip() is None
          print('PASS',dest,dest.stat().st_size,'bytes',len(files),'files')
          assert dest.stat().st_size<10_000_000,'Neon screenshot pack must stay under 10 MB'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Triggle-PR338-Neon-Phase2-15-Mobile-Screenshots
          path: /tmp/Triggle_PR338_15_Mobile_Screenshots.zip
          retention-days: 21
          if-no-files-found: error
      - name: Collect read-only public CI evidence from prior complete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/neon-phase2-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44978303435/jobs?per_page=100" > /tmp/neon-phase2-evidence/previous-green-quality-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44979999610/jobs?per_page=100" > /tmp/neon-phase2-evidence/stale-snapshot-failure-jobs.json
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/137073133934/logs" > /tmp/neon-phase2-evidence/previous-green-core.log
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/137073133938/logs" > /tmp/neon-phase2-evidence/previous-green-browser-shard1.log
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/137078358365/logs" > /tmp/neon-phase2-evidence/recent-stale-snapshot-failure.log
      - name: Assemble reproducible under-10-MB offline ZIP
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd()
          dest=Path('/tmp/Triggle_PR338_Neon_Phase2_Offline_Review.zip')
          extra=Path('/tmp/neon-phase2-evidence')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          all_paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          keep=[]
          for name in all_paths:
              if not name: continue
              included=name.startswith('site/') or name.startswith('docs/curriculum/grade-10/') or name in (
                 'package.json','package-lock.json','.github/workflows/smart-ci.yml','.github/workflows/deploy.yml'
              )
              if not included: continue
              if name.lower().endswith(('.webm','.mp4','.mp3','.wav','.ogg','.pdf','.zip','.tar','.gz')):continue
              file=root/name
              if file.is_file() and file.stat().st_size < 3_000_000: keep.append(name)
          must=[
             'site/index.html',
             'site/data/textbook-exercises/g10-ch7-ex7-1-q6-q10-en.js',
             'site/assets/grade10-ch7/ex7-1-q10.svg',
             'site/tools/test_g10_ch7_ex71_q6_q10_draft.cjs',
             'site/tools/test_g10_ch7_ex71_q6_q10_mobile_browser.cjs',
             'docs/curriculum/grade-10/g10-ch7-ex7-1-q6-q10-passports-20261122.json',
             'docs/curriculum/grade-10/G10_CH7_EX71_Q6_Q10_NEON_PHASE1_RECONCILIATION_20261122.md',
             'package.json','package-lock.json',
          ]
          missing=[p for p in must if p not in keep]
          if missing:raise SystemExit('Missing required audited files: '+str(missing))
          info=f'''TRIGGLE / G10 EX 7.1 Q6-Q10 / GEMINI NEON PHASE 2
          SOURCE SNAPSHOT SHA: {sha}
          BRANCH: feature/g10-ch7-ex71-q6-q10-conveyor-20261122
          PR: https://github.com/vigneswaranmba20-afk/Triggle/pull/338
          AUDIT SCOPE: Read-only, original math Source Phase 1 PASS.
          STILL BLOCKED: Independent Phase 2 UI & implementation inspection; DO NOT MERGE.
          CI: Previous full-green run 44978303435; later 44979999610 failed stale generated status.
          Source-derived status regenerated in this package and validation passed.
          To inspect locally: unzip, npm ci, npx playwright install --with-deps --only-shell chromium,
          then node site/tools/test_g10_ch7_ex71_q6_q10_draft.cjs and
          node site/tools/test_g10_ch7_ex71_q6_q10_mobile_browser.cjs .
          For browsers: no external services required after package dependencies installed.
          Note: video binaries and archive/PDF files excluded to fit <10MB; included source, SVGs,
          KaTeX runtime/assets, docs and key CI logs. Do not use deployed Pages for Q6-Q10:
          these questions are still unpublished.
          '''
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              z.writestr('NEON_READ_ME_FIRST.txt',info)
              for p in keep:z.write(root/p,arcname=p)
              for p in sorted(extra.glob('*')):z.write(p,arcname='CI_EVIDENCE/'+p.name)
              z.writestr('FILE_HASHES_SHA256.json',json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in keep},indent=2))
          size=dest.stat().st_size
          print('OFFLINE PACK:',dest,'files',len(keep),'bytes',size)
          if size>10_000_000:raise SystemExit('Bundle exceeds Neon 10 MB limit; refuse to publish')
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              for p in must:assert p in z.namelist(),p
          print('PASS offline bundle integrity, all required source files present')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Triggle-PR338-Neon-Phase2-Offline-Source
          path: /tmp/Triggle_PR338_Neon_Phase2_Offline_Review.zip
          retention-days: 21
          if-no-files-found: error
      - name: Remove temporary workflow from draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          git rm .github/workflows/tmp-neon-phase2-mobile-screenshots-20261122.yml
          git commit -m "chore(g10): sync reviewed status and archive final visual evidence"
          git push origin HEAD:feature/g10-ch7-ex71-q6-q10-conveyor-20261122
