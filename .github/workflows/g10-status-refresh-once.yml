name: One-time G10 public status refresh
on:
  push:
    branches:
      - release/g10-five-workstream-checkpoint-20261111
    paths:
      - .github/workflows/g10-status-refresh-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerate deterministic public status snapshot
        run: node site/tools/build_project_status.cjs
      - name: Commit only the generated public projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(status): regenerate Grade 10 project projection"
            git push origin HEAD:release/g10-five-workstream-checkpoint-20261111
          fi
