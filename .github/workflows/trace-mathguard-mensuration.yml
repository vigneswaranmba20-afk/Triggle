name: TRACE MathGuard V1.0 — Mensuration Pilot

on:
  workflow_dispatch:
    inputs:
      strict_answers:
        description: 'Fail workflow if any exercise/concept answer fails independent verification'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  mathguard-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic math dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 pytest==9.2.0

      - name: Run MathGuard unit and integration tests
        run: PYTHONPATH=site/tools python -m pytest site/tools/mathguard/tests/test_mathguard.py -v

      - name: Run 120-case controlled mutation benchmark
        run: PYTHONPATH=site/tools python -m mathguard.cli benchmark --out build/mathguard/benchmark-results.json --strict

      - name: Run Grade 10 Chapter 7 Mensuration audit
        run: |
          if [ "${{ inputs.strict_answers }}" = "true" ]; then
            PYTHONPATH=site/tools python -m mathguard.cli audit --out-dir build/mathguard --strict-answers
          else
            PYTHONPATH=site/tools python -m mathguard.cli audit --out-dir build/mathguard
          fi

      - name: Upload MathGuard audit and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-mathguard-mensuration-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mathguard/
          retention-days: 14
          if-no-files-found: error
