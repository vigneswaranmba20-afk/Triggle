name: TEMP AUD14-02 source snapshot for offline local regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-aud14-source-snapshot.yml'

permissions:
  contents: read

jobs:
  public-source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive public source only (no secrets, git history or installed packages)
        run: |
          set -euo pipefail
          tar -czf /tmp/triggle-aud14-public-source.tgz \
            --exclude='site/videos' \
            --exclude='site/video-factory/cache' \
            --exclude='site/assets/videos' \
            site docs package.json package-lock.json
          ls -lh /tmp/triggle-aud14-public-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: temp-aud14-source-snapshot
          path: /tmp/triggle-aud14-public-source.tgz
          retention-days: 1
