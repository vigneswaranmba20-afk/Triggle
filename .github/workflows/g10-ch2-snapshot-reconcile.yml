name: One-time TRACE Grade 10 source snapshot reconciliation
on:
  pull_request:
    paths:
      - '.github/workflows/g10-ch2-snapshot-reconcile.yml'
      - 'site/data/textbook-exercises/g10-ch2-trace-*.js'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/g10-ch2-trace-9of10-foundations-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild deterministic public curriculum projection
        run: node site/tools/build_project_status.cjs
      - name: Commit only source-derived snapshot to this review branch
        run: |
          if git diff --quiet -- site/data/project-status.json; then
            echo 'Snapshot already reconciled'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          git commit -m 'Reconcile Grade 10 Chapter 2 source-derived public curriculum snapshot'
          git push origin HEAD:feat/g10-ch2-trace-9of10-foundations-20261115
