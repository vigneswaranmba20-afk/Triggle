# One-time isolated generated-asset refresh for Grade 9 Exercise 2.4.
name: TRACE Ex2.4 isolated generated assets once
on:
  push:
    branches:
      - trace/g9-ch2-ex2-4-decimal-precision-20261117
    paths:
      - .github/workflows/trace-ex24-generated-assets-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    name: Build maths presentation, verify source rounding and public status
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trace/g9-ch2-ex2-4-decimal-precision-20261117
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate source-derived Grade 9 math
        run: node site/tools/build_g9_math.cjs
      - name: Reconcile public project-status source hashes
        run: npm run status:build
      - name: Independently verify Exercise 2.4 and derived outputs
        run: |
          node docs/curriculum/grade-9/tests/ex2-4-source-audit-math.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_g9_math_compiler.cjs
          node site/tools/test_g9_real_numbers.cjs
          npm run status:check
      - name: Commit only source-derived outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/g9-clear-math.js site/data/project-status.json
          if git diff --cached --quiet; then
            echo "Generated outputs already current."
          else
            git commit -m "build(g9): refresh Ex2.4 precise maths presentation and public status"
            git push origin "HEAD:trace/g9-ch2-ex2-4-decimal-precision-20261117"
          fi
