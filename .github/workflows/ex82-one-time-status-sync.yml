name: One-time Ex8.2 status snapshot regeneration
on:
  push:
    branches:
      - exercise/g10-ex82-q4-q8-neon-chatgpt-20261121
    paths:
      - .github/workflows/ex82-one-time-status-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate source-verified public status and push changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run status:build
          node site/tools/test_project_status.cjs
          if git diff --quiet -- site/data/project-status.json; then
            echo "Status snapshot is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          git commit -m "chore(g10): regenerate source-derived status after Ex8.2 Q4-Q8"
          git push origin HEAD:refs/heads/exercise/g10-ex82-q4-q8-neon-chatgpt-20261121
