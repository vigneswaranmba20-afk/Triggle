name: TRACE G9 final one-time source status refresh
on:
  push:
    branches: [feature/trace-g9-ex12-batch1-q3-q5-20261117]
    paths: [.github/workflows/trace-g9-status-rebaseline-final.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify public source-derived curriculum status
        run: |
          npm run status:build
          node site/tools/test_project_status.cjs
      - name: Commit exact generated snapshot on this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh Grade 9 batch one difficulty-backed status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
