name: One-time regenerate combined Grade 9 Exercise 1.2
on:
  push:
    branches: [feature/trace-g9-ex12-combined-20261117]
    paths: [.github/workflows/trace-g9-ex12-integration-compile.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical mathematics and curriculum status
        run: |
          node site/tools/build_g9_math.cjs
          npm run status:build
      - name: Verify source, steps, mathematics, registration and status
        run: |
          node site/tools/test_g9_ex1_2_q3_q5_batch1.cjs
          node site/tools/test_g9_ex1_2_q7_q10_batch.cjs
          node site/tools/test_g9_ex1_2_combined_release.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_why_step_g9.cjs
          node site/tools/test_standard_solutions.cjs
          node site/tools/test_project_status.cjs
      - name: Commit generated files on this feature branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/g9-clear-math.js site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: regenerate integrated Grade 9 maths and curriculum status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
