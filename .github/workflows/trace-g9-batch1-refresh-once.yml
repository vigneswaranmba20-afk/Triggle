name: TRACE G9 batch one — regenerate source-derived status once
on:
  push:
    branches:
      - feature/trace-g9-ex12-batch1-q3-q5-20261117
    paths:
      - .github/workflows/trace-g9-batch1-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate and test the allowlisted public project-status projection
        run: |
          npm run status:build
          node site/tools/test_project_status.cjs
      - name: Commit generated projection to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/project-status.json
          if git diff --cached --quiet; then
            echo "Projection already current"
          else
            git commit -m "ci: regenerate audited G9 exercise status projection"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
