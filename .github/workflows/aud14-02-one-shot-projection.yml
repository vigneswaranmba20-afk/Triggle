name: AUD14-02 regenerate Grade 9 four-figure-table maths projection (one-shot)
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/aud14-02-g9-ex64-table-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild generated Grade 9 math and public curriculum snapshot
        run: |
          node site/tools/build_g9_math.cjs
          node site/tools/build_project_status.cjs
      - name: Confirm source-derived outputs and scoped table-method guards
        run: |
          node site/tools/build_g9_math.cjs --check
          node site/tools/build_project_status.cjs --check
          node site/tools/test_g9_ch6_aud14_02.cjs
          node site/tools/test_standard_solutions.cjs
          node site/tools/test_why_step_g9.cjs
          node site/tools/test_g9_clear_math.cjs
      - name: Commit only deterministic generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g9-clear-math.js site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(aud14-02): synchronize Grade 9 math and source-derived public status'
            git push origin HEAD:audit-fix/aud14-02-g9-ex64-table-20261122
          fi
