name: Temporary Grade 10 status projection refresh
on:
  push:
    branches:
      - feature/g10-seven-source-verified-recovery-20261113
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'vigneswaranmba20-afk/Triggle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild source-derived status without relaxing tests
        run: npm run status:build
      - name: Commit only generated status
        run: |
          git config user.name "triggle-status-bot"
          git config user.email "triggle-status-bot@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate truthful Grade 10 source-derived status"
            git push origin HEAD:feature/g10-seven-source-verified-recovery-20261113
          fi
