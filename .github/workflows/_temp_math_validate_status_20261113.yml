name: Temporary ChatGPT Math formula validation and status
on:
  push:
    branches:
      - fix/chatgpt-math-notation-all-new-g10-20261113
permissions:
  contents: write
jobs:
  verify-and-refresh:
    if: github.repository == 'vigneswaranmba20-afk/Triggle'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every authored KaTeX formula
        run: node site/tools/test_chatgpt_math_g10.cjs
      - name: Refresh truthful source-derived status
        run: npm run status:build
      - name: Commit generated status only
        run: |
          git config user.name "triggle-status-bot"
          git config user.email "triggle-status-bot@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate source-derived status after KaTeX correction"
            git push origin HEAD:fix/chatgpt-math-notation-all-new-g10-20261113
          fi
