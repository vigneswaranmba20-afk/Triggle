name: TRACE Mission 08 refresh status (temporary)
on:
  push:
    branches: [feature/g10-ch4-ex4-3-mission08-20261120]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run status:build && node site/tools/test_project_status.cjs
      - name: Commit generated status
        shell: bash
        run: |
          set -euo pipefail
          git add site/data/project-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(trace): refresh merged Geometry concepts/exercises status"
          git push origin HEAD:feature/g10-ch4-ex4-3-mission08-20261120
