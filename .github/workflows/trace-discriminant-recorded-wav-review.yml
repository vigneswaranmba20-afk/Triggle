name: TRACE discriminant — recorded Fola WAV to MP4 (zero model API)

# Manual-only real-video assembly. Never publishes media to the student app.
on:
  workflow_dispatch:
    inputs:
      voice_zip_url:
        description: 'Single GitHub issue attachment ZIP containing the 9 recorded WAV files'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: trace-discriminant-wav-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce-review-only:
    name: Nine verified WAV beats → real narrated MP4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LESSON: g10-ch3-discriminant
      VOICE_ZIP_URL: ${{ inputs.voice_zip_url }}
      WAV_DIR: build/trace-video/discriminant-recorded-wavs
      OUTPUT_DIR: build/trace-video/discriminant-real-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify mathematics, recording filenames and independent voice import security
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_discriminant_video.py
          python3 site/tools/test_trace_voice_pack_import.py
          python3 site/tools/trace_video_factory.py self-test --lesson "$LESSON"
          python3 site/tools/trace_video_recording_sheet.py --lesson "$LESSON" --output docs/trace/DISCRIMINANT_FOLA_RECORDING_SHEET.md --check
      - name: Import genuine external Fola recordings; never request generation
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/trace_voice_pack_import.py \
            --lesson "$LESSON" \
            --url "$VOICE_ZIP_URL" \
            --output "$WAV_DIR"
      - name: Install offline renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python3 -m pip install -r site/video-factory/requirements.txt
      - name: Render nine real narrated scenes with source-derived geometry
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_discriminant_video.py
          python3 site/tools/trace_video_factory.py render \
            --lesson "$LESSON" --mode existing --existing-dir "$WAV_DIR" \
            --width 720 --height 1280 --fps 12 \
            --cache build/trace-video/disc-render-cache \
            --output "$OUTPUT_DIR"
      - name: Verify all real-audio scenes, exact 9:16 size and review-only status
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_DIR'])
          voice=Path(os.environ['WAV_DIR'])
          result=json.loads((root/'result.json').read_text())
          manifest=json.loads((voice/'voice-pack-manifest.json').read_text())
          assert result['lessonId']=='g10-ch3-discriminant'
          assert result['mode']=='existing' and result['reviewRequired']
          assert result['width']==720 and result['height']==1280
          assert result['fps']==12 and len(result['beats'])==9
          assert len(manifest['beats'])==9 and manifest['noModelApiCalls']
          assert manifest['releaseApproved'] is False
          assert (root/result['videoFile']).stat().st_size>50000
          print('PASS: actual WAV-to-MP4 assembly verified. Voice listening and student release APPROVAL STILL REQUIRED.')
          PY
      - name: Upload private, review-only video artifact (no R2 publication)
        uses: actions/upload-artifact@v4
        with:
          name: trace-discriminant-real-review-${{ github.run_id }}
          path: |
            build/trace-video/discriminant-real-review/*.mp4
            build/trace-video/discriminant-real-review/result.json
            build/trace-video/discriminant-recorded-wavs/voice-pack-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Explicit release boundary
        run: |
          echo 'A real narrated MP4 is available as an ARTIFACT for private review.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model API requests, no auto-publication, no Cloudflare upload, no website edits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Human must approve voice identity, timing, graphs, formula and 360px mobile playback before release.' >> "$GITHUB_STEP_SUMMARY"
