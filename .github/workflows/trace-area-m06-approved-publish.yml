name: TRACE Mission 06 — reviewed Fola area video release

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/tools/trace_area_m06_release.py'
      - 'site/tools/test_trace_area_m06_release.py'
      - 'site/assets/chapter-hub.js'
      - '.github/workflows/trace-area-m06-approved-publish.yml'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trace-m06-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-code-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Zero-API exact math, release scope, player and version tests
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_area_m06_release.py
          node --check site/assets/chapter-hub.js
          node site/tools/test_g10_ch5_concepts.cjs
          echo 'PASS release code only; no new MP4 has been published'

  approved-mp4-to-r2:
    name: Exact owner-attached V2 MP4 to immutable R2 and separate release PR
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 351 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'vigneswaranmba20-afk' &&
      contains(github.event.comment.body, 'TRACE_PUBLISH_G10_AREA_M06_V2_20261122')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APPROVAL_COMMENT: ${{ github.event.comment.body }}
      LESSON: g10-ch5-area-triangle
      EXPECTED_SHA256: 7b0eac211cb97175a46f335ad339a3fb91c7649124fd4021143cbc08b68575ec
      EXPECTED_SIZE: '3341368'
      VIDEO: build/trace-video/area-m06-v2.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact release preflight before touching remote media
        run: |
          set -euo pipefail
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_area_m06_release.py
          node --check site/assets/chapter-hub.js
      - name: Download only one official GitHub issue MP4 attachment
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$VIDEO")"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request,urlopen
          marker='TRACE_PUBLISH_G10_AREA_M06_V2_20261122'
          body=os.environ['APPROVAL_COMMENT']
          if len(re.findall(r'(?m)^'+re.escape(marker)+r'\s*$',body)) != 1:
              raise SystemExit('Owner marker must occur exactly once on its own line')
          urls=re.findall(r'https://github\.com/user-attachments/(?:files|assets)/[A-Za-z0-9_-]+(?:/[A-Za-z0-9._%+-]+)?',body)
          if len(urls)!=1:
              raise SystemExit('Exactly one GitHub user-attachments V2 MP4 link is required')
          source=urlsplit(urls[0])
          if source.scheme!='https' or source.hostname!='github.com' or source.port or source.username or source.password:
              raise SystemExit('Untrusted attachment URL')
          target=Path(os.environ['VIDEO'])
          total=0
          with urlopen(Request(urls[0],headers={'User-Agent':'Triggle-TRACE-M06-reviewed-media/1'}), timeout=120) as response:
              redirect=urlsplit(response.geturl())
              host=(redirect.hostname or '').lower()
              if redirect.scheme!='https' or not (host=='github.com' or host.endswith('.githubusercontent.com') or host.endswith('.amazonaws.com')):
                  raise SystemExit('Untrusted attachment redirect')
              with target.open('wb') as output:
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk: break
                      total+=len(chunk)
                      if total>5_000_000:raise SystemExit('MP4 exceeds 5MB safety limit')
                      output.write(chunk)
          if total!=int(os.environ['EXPECTED_SIZE']):
              raise SystemExit('Wrong V2 MP4 file size')
          print('PASS owner attachment size:',total)
          PY
      - name: Check precise SHA, H264/AAC, 9:16 portrait, duration and complete decode
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $VIDEO" | sha256sum --check -
          python3 - <<'PY'
          import json,os,subprocess
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'format=size,duration:stream=codec_type,codec_name,width,height,r_frame_rate',
            '-of','json',os.environ['VIDEO']]))
          assert int(info['format']['size'])==int(os.environ['EXPECTED_SIZE'])
          assert abs(float(info['format']['duration'])-109.6)<0.1
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264'
            and s.get('width')==720 and s.get('height')==1280
            and s.get('r_frame_rate')=='10/1' for s in info['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac'
            for s in info['streams'])
          print('PASS exact owner-reviewed V2, 109.6sec at 720x1280, H264/AAC 10fps')
          PY
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -f null -
      - name: Upload immutable MP4 to existing Cloudflare R2; check public range
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          for v in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "$(printenv "$v")" || { echo "Missing existing R2 secret $v"; exit 1; }
          done
          [[ "$R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          PUBLIC="$(printf '%s' "$R2_PUBLIC_BASE_URL" | sed 's@/$@@')"
          test "$PUBLIC" = 'https://pub-ed71b86e97a64b428086e292b26fb7a2.r2.dev'
          if ! command -v aws >/dev/null; then python3 -m pip install -q awscli; fi
          KEY="trace-videos/$LESSON/$EXPECTED_SHA256.mp4"
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --endpoint-url "$ENDPOINT" s3 cp "$VIDEO" "s3://$R2_BUCKET/$KEY" --content-type video/mp4 --no-progress
          SIZE="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --query ContentLength --output text)"
          test "$SIZE" = "$EXPECTED_SIZE"
          URL="$PUBLIC/$KEY"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --range 0-1023 --dump-header /tmp/m06-r2-header.txt "$URL" -o /tmp/m06-r2-prefix
          cmp -n 1024 "$VIDEO" /tmp/m06-r2-prefix
          grep -Eq '^HTTP/[0-9.]+ 206([[:space:]]|$)' /tmp/m06-r2-header.txt || {
            echo 'R2 endpoint did not confirm partial-content range playback'; exit 1; }
          echo "public_url=$URL" >> "$GITHUB_OUTPUT"
          echo 'PASS exact immutable approved MP4 on R2 and browser byte-range response'
      - name: Prepare separate Chapter 5 video release PR; never direct-push main
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.r2.outputs.public_url }}
        run: |
          set -euo pipefail
          python3 site/tools/trace_area_m06_release.py register --url "$PUBLIC_URL"
          node site/tools/build_project_status.cjs
          python3 site/tools/test_trace_area_m06_release.py
          BRANCH="video/area-m06-v2-approved-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g10-ch5-concepts.js site/index.html site/service-worker.js site/data/project-status.json
          git diff --cached --quiet && { echo 'Refusing empty release commit'; exit 1; }
          git commit -m 'Publish approved Fola area-of-triangle V2 video for Grade 10'
          git push origin "$BRANCH"
          {
            echo "## TRACE M06 staged — student website PR and QA still required"
            echo
            echo "Release branch: \`$BRANCH\`"
            echo "R2 verified URL: $PUBLIC_URL"
            echo "SHA256: \`$EXPECTED_SHA256\`"
            echo 'Do not claim Pages publication before green quality gates and live player verification.'
          } >> "$GITHUB_STEP_SUMMARY"
          if gh pr create --base main --head "$BRANCH" \
            --title 'Publish approved TRACE M06 Fola V2 — Grade 10 area of triangle' \
            --body "Exact owner-reviewed SHA256: $EXPECTED_SHA256. R2 byte range verified. One concept, loader/cache/status only. Require independent Triggle quality gate + Android Watch-button verification before merging."; then
            echo 'Release PR opened; manual approval and quality gate required.'
          else
            echo 'PR creation not permitted by workflow token. Branch is staged; use connected GitHub account to open release PR.'
          fi
