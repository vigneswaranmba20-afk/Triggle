name: Temporary Ex8.2 Tamil status projection
on:
  push:
    branches:
      - exercise/g10-ex82-tamil-source-parity-20261122
    paths:
      - .github/workflows/ex82-tamil-status-sync.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update allowlisted public curriculum projection
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run status:build
          node site/tools/test_project_status.cjs
          if git diff --quiet -- site/data/project-status.json; then
            echo 'Snapshot current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          git commit -m 'chore(i18n): regenerate source-derived Tamil availability snapshot'
          git push origin HEAD:refs/heads/exercise/g10-ex82-tamil-source-parity-20261122
