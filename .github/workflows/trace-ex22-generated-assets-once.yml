# One-time source-derived asset rebuild on the isolated Exercise 2.2 branch.
# Delete this temporary workflow after it produces a verified commit.
name: TRACE Ex2.2 isolated generated assets rebuild once
on:
  push:
    branches:
      - trace/g9-ch2-ex2-2-source-audit-20261117
    paths:
      - .github/workflows/trace-ex22-generated-assets-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    name: Rebuild maths presentation and project-status snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trace/g9-ch2-ex2-2-source-audit-20261117
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deterministically regenerate Grade 9 maths presentation
        run: node site/tools/build_g9_math.cjs
      - name: Reconcile public project status from the final source hashes
        run: npm run status:build
      - name: Verify source evidence, exact rational arithmetic and generated files
        run: |
          node docs/curriculum/grade-9/tests/ex2-2-source-audit-math.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_g9_math_compiler.cjs
          npm run status:check
      - name: Commit only generated outputs to the isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/g9-clear-math.js site/data/project-status.json
          if git diff --cached --quiet; then
            echo "No generated changes needed."
          else
            git commit -m "build(g9): regenerate Ex2.2 teaching presentation and status"
            git push origin "HEAD:trace/g9-ch2-ex2-2-source-audit-20261117"
          fi
