name: TRACE approved Discriminant Fola — verified R2 and quality-gated publish

# Runs after repository owner adds one EXACT reviewed MP4 attachment on Issue #290.
# No model API calls, no arbitrary upload target, and no direct writes to main.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: trace-discriminant-fola-publish-20261120
  cancel-in-progress: false

jobs:
  stage-and-open-reviewed-release:
    name: Verify approved video, stage on R2, open guarded website PR
    if: ${{ github.event.issue.number == 290 && !github.event.issue.pull_request && github.event.comment.user.login == 'vigneswaranmba20-afk' && contains(github.event.comment.body, 'TRACE_PUBLISH_DISC_FOLA_20261120') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      LESSON: g10-ch3-discriminant
      VIDEO_SHA256: 4c692aa75bad331a6d1f859f3c8be79da3d621af15259ac5e79ebadb79eef890
      VIDEO_SIZE: '5544243'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require merged video factory and verify release adapter before touching R2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/291" --jq '.merged')" = true || {
            echo 'Mission 04 video factory PR #291 must merge before publication'; exit 1;
          }
          test -f site/video-factory/lessons/g10-ch3-discriminant.json
          python3 site/tools/test_trace_discriminant_release.py
          python3 site/tools/trace_video_factory.py self-test --lesson "$LESSON"
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY

      - name: Download EXACT reviewed MP4 from one owner-authored GitHub attachment
        run: |
          set -euo pipefail
          mkdir -p build/trace-video/discriminant-approved
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          body=os.environ['COMMENT_BODY']
          if not re.search(r'(?m)^TRACE_PUBLISH_DISC_FOLA_20261120\s*$',body):
              raise SystemExit('Approval marker must be on its own line')
          urls=re.findall(r'https://github\.com/user-attachments/(?:files|assets)/[A-Za-z0-9_-]+(?:/[A-Za-z0-9._%-]+)?',body)
          if len(urls)!=1:
              raise SystemExit('Exactly one GitHub issue MP4 attachment is required')
          url=urls[0]
          p=urlsplit(url)
          if p.scheme!='https' or p.hostname!='github.com' or p.username or p.password or p.port:
              raise SystemExit('Only official GitHub issue attachment URL is permitted')
          output=Path('build/trace-video/discriminant-approved/reviewed-discriminant.mp4')
          req=Request(url, headers={'User-Agent':'Triggle-TRACE-reviewed-media/1'})
          with urlopen(req,timeout=110) as response:
              final=urlsplit(response.geturl())
              host=(final.hostname or '').lower()
              if final.scheme!='https' or not (host=='github.com' or host.endswith('.githubusercontent.com') or host.endswith('.amazonaws.com')):
                  raise SystemExit('Untrusted attachment redirect')
              total=0
              with output.open('wb') as target:
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk: break
                      total+=len(chunk)
                      if total>8_000_000:
                          raise SystemExit('MP4 over bounded 8 MB release limit')
                      target.write(chunk)
          print('Downloaded owner attachment:',total,'bytes')
          PY

      - name: Verify exact fingerprint, duration, media streams and full decode
        run: |
          set -euo pipefail
          FILE=build/trace-video/discriminant-approved/reviewed-discriminant.mp4
          echo "${VIDEO_SHA256}  ${FILE}" | sha256sum -c -
          test "$(stat -c %s "$FILE")" = "$VIDEO_SIZE"
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python3 - <<'PY'
          import json, subprocess
          file='build/trace-video/discriminant-approved/reviewed-discriminant.mp4'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
              'stream=codec_name,codec_type,width,height,r_frame_rate:format=duration,size','-of','json',file]))
          assert abs(float(info['format']['duration'])-152.437663)<0.2
          assert int(info['format']['size'])==5544243
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264'
               and s.get('width')==720 and s.get('height')==1280
               and s.get('r_frame_rate')=='12/1' for s in info['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in info['streams'])
          print('PASS approved 9-beat 152.44-second Fola video fingerprint and format')
          PY
          ffmpeg -hide_banner -loglevel error -i "$FILE" -f null -

      - name: Upload exact hash-pinned MP4 to existing Cloudflare R2 and verify public bytes
        id: r2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          for v in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "Missing configured R2 secret ${v}"; exit 1; }
          done
          [[ "${R2_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]
          [[ "${R2_PUBLIC_BASE_URL%/}" == 'https://pub-ed71b86e97a64b428086e292b26fb7a2.r2.dev' ]] || {
            echo 'R2 host differs from approved site player allowlist; refuse upload'; exit 1;
          }
          python3 -m pip install --quiet awscli
          KEY="trace-videos/${LESSON}/${VIDEO_SHA256}.mp4"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          FILE=build/trace-video/discriminant-approved/reviewed-discriminant.mp4
          URL="${R2_PUBLIC_BASE_URL%/}/${KEY}"
          aws --endpoint-url "$ENDPOINT" s3 cp "$FILE" "s3://${R2_BUCKET}/${KEY}" --content-type video/mp4 --no-progress
          LENGTH="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --query ContentLength --output text)"
          test "$LENGTH" = "$VIDEO_SIZE"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --range 0-1023 "$URL" -D /tmp/discriminant-r2-headers -o /tmp/discriminant-r2-prefix
          cmp -n 1024 "$FILE" /tmp/discriminant-r2-prefix
          echo "public_url=$URL" >> "$GITHUB_OUTPUT"
          echo "PASS exact approved 152.44s Discriminant MP4 staged at immutable R2 key and public byte range verified"

      - name: Update only Discriminant lesson link and mobile cache; open protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.r2.outputs.public_url }}
        run: |
          set -euo pipefail
          python3 site/tools/trace_discriminant_release.py register --url "$PUBLIC_URL"
          node site/tools/build_project_status.cjs
          BRANCH="video/discriminant-fola-approved-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/g10-ch3-concepts.js site/index.html site/service-worker.js site/data/project-status.json
          git diff --cached --quiet && { echo 'No release change; refusing no-op'; exit 1; }
          git commit -m 'Publish owner-approved Fola Discriminant lesson'
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title 'Publish approved Fola video: Grade 10 Discriminant' \
            --body "Owner-approved exact media hash: ${VIDEO_SHA256}; 152.44s, 720×1280, nine Fola scenes. R2 public range verified. Changes limited to one concept and cache/status. Requires Triggle quality gate. Factory PR #291 must remain preserved.")"
          echo "Website release PR: $PR_URL"
          gh workflow run smart-ci.yml --ref "$BRANCH"
          gh pr merge --auto --squash "$PR_URL"
          printf '## Discriminant Fola release submitted\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Video SHA-256: `%s`\n\n' "$VIDEO_SHA256" >> "$GITHUB_STEP_SUMMARY"
          printf 'Immutable video URL: %s\n\n' "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Website release PR: %s\n\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'This action does not bypass the required Triggle quality gate or assert live Pages publication.' >> "$GITHUB_STEP_SUMMARY"
