name: Full browser regression (sharded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-shard:
    name: Browser tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate all unit and curriculum tests
        run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Run one quarter of the full browser-test script
        run: node site/tools/run_browser_shard.cjs
        env:
          BROWSER_SHARD_INDEX: '${{ matrix.shard }}'
          BROWSER_SHARD_TOTAL: '4'
          CHROMIUM_PATH: ''
      - name: Verify retired dashboard and teacher flow in WebKit
        if: matrix.shard == 0
        run: npm run test:webkit
      - name: Preserve mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: screenshots/*.png
          if-no-files-found: ignore

  browser-all:
    name: Full browser regression passed
    needs: browser-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Assert all four browser shards succeeded
        env:
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARDS_RESULT" = "success"
