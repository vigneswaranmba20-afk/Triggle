name: Apply Grade 9 bulk mathematics content
on:
  push:
    branches:
      - content/g9-ch7-ch8-bulk-20261109
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage offline content ZIP for import')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import prepared and reviewed content files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.').resolve()
          zpath=root/'.bulk/g9-ch7-ch8-content.zip'
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert 'site/index.html' in names and 'site/tools/test_g9_bulk_content_only.cjs' in names
              assert len(names)==23,(len(names),names)
              for name in names:
                  dest=(root/name).resolve()
                  assert dest.is_relative_to(root) and not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts,name
                  assert name.startswith(('site/','docs/')) or name=='CODEX_GRADE9_CONTENT_QA_PROMPT.md',name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          # Preserve textbook order in the existing menu; no UI redesign.
          index=root/'site/index.html'
          html=index.read_text()
          a='<script src="./data/textbook-exercises/g9-ch8-ex8-4-en.js?v=g9-bulk-20261109-1"></script>'
          b='<script src="./data/textbook-exercises/g9-ch8-ex8.2-en.js?v=g9-bulk-20261109-1"></script>'
          c='<script src="./data/textbook-exercises/g9-ch8-ex8.3-en.js?v=g9-bulk-20261109-1"></script>'
          assert html.count(a)==html.count(b)==html.count(c)==1
          html=html.replace(a+b+c,b+c+a)
          index.write_text(html)
          # Keep the legacy deep-link regression focused on legacy questions,
          # excluding newly published 2025 textbook questions from its count.
          test=root/'site/tools/test_curriculum_ui.cjs'
          text=test.read_text()
          before="&& !item.id.startsWith('g9-ch9-ex9.1-')).map"
          after="&& !item.id.startsWith('g9-ch9-ex9.1-') && !/^g9-ch(?:7|8)-ex/.test(item.id) && !/^g9-ch9-(?:ex9\\.[23]-|example-)/.test(item.id)).map"
          assert text.count(before)==1,'Legacy filter anchor changed; do not silently update test'
          text=text.replace(before,after)
          test.write_text(text)
          # Remove the import mechanism after use, preserving only textbook data,
          # source evidence, existing site registrations and meaningful tests.
          zpath.unlink()
          pathlib.Path('.bulk').rmdir()
          pathlib.Path('.github/workflows/apply-g9-bulk.yml').unlink()
          PY
      - name: Lightweight mathematical and static validation
        shell: bash
        run: |
          node site/tools/test_g9_bulk_content_only.cjs
          npm run validate
      - name: Commit imported content onto branch
        shell: bash
        run: |
          git config user.name "Triggle content importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content(g9): stage 66 English Mensuration and Statistics questions with checked mathematics"
          git push origin HEAD:content/g9-ch7-ch8-bulk-20261109
