name: Temporary refresh Grade 9 Why status projection
on:
  push:
    branches: [feat/g9-why-this-step-20261114]
    paths: ['.github/workflows/tmp-refresh-why-g9-status.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g9-why-this-step-20261114
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/tools/build_project_status.cjs
      - name: Commit status snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(g9): refresh public project status after explanation audit'
            git push origin HEAD:feat/g9-why-this-step-20261114
          fi
