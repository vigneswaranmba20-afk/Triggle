# Temporary branch-only maintenance: refresh derived public status.
# Removed after its one-time run. Never accesses external credentials.
name: Refresh Grade 10 Why status snapshot
on:
  push:
    branches: [feat/g10-why-this-step-20261114]
    paths:
      - '.github/workflows/refresh-g10-why-status.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g10-why-this-step-20261114
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/tools/build_project_status.cjs
      - name: Commit generated projection to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(status): regenerate projection for Grade 10 why-step feature'
            git push origin HEAD:feat/g10-why-this-step-20261114
          fi
