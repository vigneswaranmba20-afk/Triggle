name: Temporary ChatGPT Math source-status refresh
on:
  push:
    branches:
      - fix/chatgpt-math-notation-all-new-g10-20261113
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'vigneswaranmba20-afk/Triggle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh the actual source-derived status data
        run: npm run status:build
      - name: Commit only the generated project status
        run: |
          git config user.name "triggle-status-bot"
          git config user.email "triggle-status-bot@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: source-derived status after maths typesetting"
            git push origin HEAD:fix/chatgpt-math-notation-all-new-g10-20261113
          fi
