name: Temporary G10 Ch7 Phase2 status and mobile closure
on:
  push:
    branches:
      - feature/g10-ch7-ex71-q6-q10-conveyor-20261122
permissions:
  contents: write
concurrency:
  group: g10-ch7-q6q10-phase2-final-check
  cancel-in-progress: true
jobs:
  validate-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Rebuild and verify source-derived status
        run: |
          npm run status:build
          npm run status:check
          node site/tools/test_g10_ch7_ex71_q6_q10_draft.cjs
          node site/tools/test_standard_solutions.cjs
      - name: Install Chromium headless
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify 15 mobile views and actual click interactions
        run: node site/tools/test_g10_ch7_ex71_q6_q10_mobile_browser.cjs
      - name: Remove temporary workflow and store refreshed projection
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          git rm .github/workflows/tmp-g10-ch7-q6q10-final-phase2-check-20261122.yml
          git diff --cached --check
          git commit -m "chore(g10): finalize Phase2 source status after mobile QA"
          git push origin HEAD:feature/g10-ch7-ex71-q6-q10-conveyor-20261122
