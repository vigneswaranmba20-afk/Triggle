name: TEMP regenerate Grade 9 math and status after AUD14 teaching hints
on:
  push:
    branches: [audit-fix/g9-ex64-q2q3-clean-20261122]
    paths: ['.github/workflows/temp-g9-ex64-posthint-rebuild.yml']
permissions:
  contents: write
jobs:
  rebuild-source-projections:
    if: "!contains(github.event.head_commit.message, 'remove temporary posthint workflow')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate all changed source-derived assets
        shell: bash
        run: |
          set -euo pipefail
          node site/tools/build_g9_math.cjs
          node site/tools/build_project_status.cjs
      - name: Run exact authored-source, math, Why and project-status gates
        shell: bash
        run: |
          set -euo pipefail
          node site/tools/build_g9_math.cjs --check
          node site/tools/test_g9_ex64_q2_q3_stage.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_why_step_g9.cjs
          node site/tools/test_standard_solutions.cjs
          node site/tools/test_project_status.cjs
      - name: Commit only regenerated maths and public status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/g9-clear-math.js site/data/project-status.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "build(g9): update offline math and provenance after seven source-pinned hints"
          git push origin "HEAD:refs/heads/audit-fix/g9-ex64-q2q3-clean-20261122"
