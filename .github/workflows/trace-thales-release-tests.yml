name: TRACE Thales exact-media release — source and safety gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/tools/trace_thales_release.py'
      - 'site/tools/test_trace_thales_release.py'
      - 'site/assets/chapter-hub.js'
      - 'site/data/g10-ch4-concepts.js'
      - '.github/workflows/trace-thales-approved-publish.yml'
      - '.github/workflows/trace-thales-release-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lesson-release-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only exact source-locked Thales URL, previous video and cache safety
        run: |
          unset GEMINI_API_KEY GOOGLE_API_KEY OPENAI_API_KEY
          python3 site/tools/test_trace_thales_release.py
          python3 site/tools/test_trace_thales_video.py
          python3 site/tools/trace_video_factory.py self-test --lesson g10-ch4-bpt-thales
          node --check site/assets/chapter-hub.js
      - name: No new bundled MP4 or student exercise changes
        run: |
          test ! -e site/videos/g10-ch4-bpt-thales.mp4
          echo 'PASS review MP4 is only staged on Cloudflare after exact owner blob and SHA checks'
          echo 'PASS no billable AI API calls, no bypass of Triggle protected quality gate'
