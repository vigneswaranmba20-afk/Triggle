name: TEMP — regenerate approved G9 table prose math and exact evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-g9-ex64-regenerate.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-fix/g9-ex64-q2q3-clean-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bind only the changed teaching sentence to its source hash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const ctx={window:{}};
          for(const f of ['site/data/class-9.js','site/data/textbook-exercises/g9-ch6-ex6-4-q2-q3-en.js'])vm.runInNewContext(fs.readFileSync(f,'utf8'),ctx);
          const data=ctx.window.TRIGGLE_CLASSES[9].items, file='docs/audit/AUD14_02_EX64_Q2_Q3_RELEASE_EVIDENCE.json';
          const proof=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const [id,p] of Object.entries(proof.records)){
            const q=data.find(row=>row.id===id);assert(q,'Missing source '+id);
            const sha=crypto.createHash('sha256').update(JSON.stringify(q)).digest('hex');
            if(id==='c9-exercise-6-4-q2-i'){
              assert.equal(q.steps[1].en,"Near 90°, several adjacent one-minute entries round to the same four-figure value. The table gives 0.9974 at 85°54′. The prescribed mean difference for the remaining minutes is 0.0001.");
              assert.notEqual(sha,p.sha256,'One edited classroom sentence must update its immutable evidence hash');
              p.sha256=sha;
            }else assert.equal(sha,p.sha256,'Other six textbook source hashes remain unchanged '+id);
          }
          fs.writeFileSync(file,JSON.stringify(proof,null,2)+'\n');
          console.log('PASS: six unchanged source hashes and one exact Q2(i) editorial hash refreshed');
          NODE
      - name: Regenerate Grade 9 visible math, never alter the source facts
        run: node site/tools/build_g9_math.cjs
      - name: Enforce source math, 404 question count and original 568-source preservation
        run: |
          node site/tools/build_g9_math.cjs --check
          node site/tools/test_g9_ex64_q2_q3_stage.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_standard_solutions.cjs
      - name: Commit only derived math and the one exact source-proof update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit/AUD14_02_EX64_Q2_Q3_RELEASE_EVIDENCE.json site/data/g9-clear-math.js
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix(g9): regenerate exact source-bound Q2(i) notation after prose correction'
          git push origin HEAD:${{ github.head_ref }}
