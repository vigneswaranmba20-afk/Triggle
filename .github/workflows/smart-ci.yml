name: Triggle risk-based quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triggle-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select required test tier
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test conservative risk policy
        run: node site/tools/ci/risk-policy.cjs --self-test
      - id: risk
        name: Classify changed files
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: node site/tools/ci/risk-policy.cjs

  core:
    name: Required tests for selected risk
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check site syntax, links, bilingual UI and offline assets
        run: node site/tools/check_site.cjs
      - name: Run precisely scoped unit and curriculum tests
        env:
          TEST_TIER: ${{ needs.plan.outputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TEST_TIER" in
            cosmetic)
              node site/tools/test_paper_indigo_theme.cjs
              node site/tools/test_bond_light_theme.cjs
              ;;
            ui)
              npm run validate
              node site/tools/test_question_navigation.cjs
              node site/tools/test_exercise_direct.cjs
              ;;
            math|major)
              npm test
              ;;
            *) echo "Unknown risk tier: $TEST_TIER" >&2; exit 1 ;;
          esac

  focused-browser:
    name: Change-specific Chromium mobile checks
    needs: [plan, core]
    if: needs.plan.outputs.tier != 'major'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused mobile browser validation
        env:
          TEST_TIER: ${{ needs.plan.outputs.tier }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_EVENT: ${{ github.event_name }}
          CHROMIUM_PATH: ''
        shell: bash
        run: |
          set -euo pipefail
          case "$TEST_TIER" in
            cosmetic)
              node site/tools/test_paper_indigo_theme_browser.cjs
              ;;
            ui)
              node site/tools/test_exercise_direct_browser.cjs
              node site/tools/test_paper_indigo_theme_browser.cjs
              ;;
            math)
              node site/tools/test_curriculum_ui.cjs
              BASE="$CI_PUSH_BEFORE"
              if [ "$CI_EVENT" = pull_request ]; then BASE="$CI_PR_BASE"; fi
              if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
                FILES="$(git diff --name-only "$BASE" HEAD)"
                if grep -Eq 'site/data/(g10-ch2|textbook-exercises/g10-ch2)' <<< "$FILES"; then
                  node site/tools/test_g10_ch2_trace_browser.cjs
                fi
                if grep -Eq 'site/data/(real-numbers|g9-)' <<< "$FILES"; then
                  node site/tools/test_g9_concepts_typography_browser.cjs
                fi
                if grep -Eq 'site/data/(class-12|g12-)' <<< "$FILES"; then
                  node site/tools/test_g12_matrix_concepts_browser.cjs
                fi
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Save failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-mobile-failure
          path: screenshots/
          if-no-files-found: ignore

  full-browser:
    name: Full Chromium/WebKit regression - shard ${{ matrix.shard }}
    needs: [plan, core]
    if: needs.plan.outputs.tier == 'major'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install only needed browsers
        shell: bash
        run: |
          if [ "${{ matrix.shard }}" = 0 ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run assigned browser partition without repeating unit tests
        env:
          BROWSER_SHARD_INDEX: ${{ matrix.shard }}
          BROWSER_SHARD_TOTAL: '4'
          CHROMIUM_PATH: ''
        run: node site/tools/run_browser_shard.cjs
      - name: WebKit and mobile dock checks
        if: matrix.shard == 0
        env:
          CHROMIUM_PATH: ''
        run: |
          npm run test:webkit
          node site/tools/test_g9_adaptive_dock_browser.cjs
      - name: Save failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-shard-${{ matrix.shard }}-failure
          path: screenshots/
          if-no-files-found: ignore

  security:
    name: Firestore security on major changes
    needs: [plan, core]
    if: needs.plan.outputs.tier == 'major'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:security

  quality:
    name: Triggle quality gate
    needs: [plan, core, focused-browser, full-browser, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject missing, cancelled, skipped or failed required checks
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          CORE: ${{ needs.core.result }}
          FOCUSED: ${{ needs.focused-browser.result }}
          FULL: ${{ needs.full-browser.result }}
          SECURITY: ${{ needs.security.result }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          set -euo pipefail
          test "$PLAN" = success && test "$CORE" = success || exit 1
          if [ "$TIER" = major ]; then
            test "$FULL" = success && test "$SECURITY" = success && test "$FOCUSED" = skipped
          else
            test "$FOCUSED" = success && test "$FULL" = skipped && test "$SECURITY" = skipped
          fi
          echo "Passed Triggle $TIER quality gate."

  publish:
    name: Publish only after successful quality gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pages: write
      id-token: write
