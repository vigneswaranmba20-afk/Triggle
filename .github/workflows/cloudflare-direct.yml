name: Mirror verified Triggle release to Cloudflare Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-direct.yml'
      - 'index.html'
      - 'site/index.html'
      - 'site/manifest.webmanifest'
      - 'site/tools/adapt_cloudflare_release.py'
      - 'site/tools/test_cloudflare_release_browser.cjs'
      - 'site/tools/student_service_worker.js'
      - 'site/tools/build_student_release.cjs'
  workflow_run:
    workflows: ["Triggle risk-based quality"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: triggle-cloudflare-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Cloudflare domain and mobile acceptance (no secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Stage and adapt the actual student release
        run: |
          set -euo pipefail
          mkdir -p cf-release/site
          cp index.html cf-release/
          cp -a site/. cf-release/site/
          node site/tools/build_student_release.cjs cf-release/site
          python3 site/tools/adapt_cloudflare_release.py cf-release
      - name: Exercise adapted release in a mobile browser
        run: node site/tools/test_cloudflare_release_browser.cjs --local cf-release

  mirror:
    name: Mirror validated main release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CF_PROJECT: triggle-direct
      CF_BASE: https://triggle-direct.pages.dev
    steps:
      - name: Reject stale release and check trusted source run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "::notice::Skipping superseded release $RELEASE_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exactly the verified GitHub Pages release artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: cf-artifact

      - name: Extract and validate immutable static release
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          out = Path("cf-release")
          out.mkdir()
          with tarfile.open("cf-artifact/artifact.tar", "r:") as archive:
              entries = archive.getmembers()
              for entry in entries:
                  path = PurePosixPath(entry.name)
                  assert not path.is_absolute() and ".." not in path.parts, entry.name
                  assert entry.isfile() or entry.isdir(), entry.name
                  if entry.isfile():
                      assert entry.size <= 25 * 1024 * 1024, f"Pages file exceeds 25 MiB: {entry.name}"
              assert sum(entry.isfile() for entry in entries) <= 20000, "Pages free-plan file count exceeded"
              archive.extractall(out, filter="data")
          for name in ("index.html", "site/index.html", "site/manifest.webmanifest",
                       "site/service-worker.js", "site/dashboard/index.html",
                       "site/teacher-review.html", "site/data/class-9.js", "site/assets/app.js"):
              file = out / name
              assert file.is_file() and file.stat().st_size > 0, name
          assert list((out / "site/assets").glob("student-*.*.*")), "Optimized student packs absent"
          print("PASS: verified static release extracted and within Pages limits")
          PY

      - name: Check out trusted release tools only after freshness check
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: release-tools
          persist-credentials: false

      - name: Adapt public metadata and synchronize cache revision
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 release-tools/site/tools/adapt_cloudflare_release.py cf-release

      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.deploy == 'true'
        with:
          node-version: '22'

      - name: Install pinned deployment CLI without credentials
        if: steps.freshness.outputs.deploy == 'true'
        run: npm install --prefix "$RUNNER_TEMP/triggle-cf-cli" --no-audit --no-fund --save-exact wrangler@4.136.3

      - name: Prepare pinned browser tests without deployment credentials
        if: steps.freshness.outputs.deploy == 'true'
        working-directory: release-tools
        run: |
          npm ci
          npx playwright install --with-deps --no-shell chromium

      - name: Recheck release head immediately before upload
        id: final_head
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "::notice::Main advanced during preparation; skipping superseded release."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the verified release to Cloudflare
        if: steps.final_head.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::Missing or invalid CLOUDFLARE_ACCOUNT_ID (or existing R2_ACCOUNT_ID)"; exit 1; }
          "$RUNNER_TEMP/triggle-cf-cli/node_modules/.bin/wrangler" pages deploy cf-release --project-name="$CF_PROJECT" --branch=main --commit-hash="$RELEASE_SHA" --commit-dirty=false

      - name: Verify deployed bytes independently of upload result
        if: steps.final_head.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html site/index.html site/manifest.webmanifest site/service-worker.js site/sitemap.xml
                 site/data/class-9.js site/assets/app.js)
          for file in cf-release/site/assets/student-*.*.*; do
            files+=("${file#cf-release/}")
          done
          for attempt in $(seq 1 12); do
            matching=1
            for file in "${files[@]}"; do
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$CF_BASE/$file?sha=$RELEASE_SHA" -o "$RUNNER_TEMP/cf-live-check" ||
                 ! cmp -s "cf-release/$file" "$RUNNER_TEMP/cf-live-check"; then
                echo "::notice::Cloudflare mismatch: $file (attempt $attempt)"
                matching=0
                break
              fi
            done
            if (( matching )); then
              echo "PASS: Cloudflare serves the verified optimized release with host metadata $RELEASE_SHA"
              echo "Cloudflare mirror: $CF_BASE/site/ — verified release $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloudflare release byte verification failed"
          exit 1

      - name: Verify live Cloudflare mobile, bilingual and offline behavior
        if: steps.final_head.outputs.deploy == 'true'
        working-directory: release-tools
        run: node site/tools/test_cloudflare_release_browser.cjs "$CF_BASE/site/"
