name: TRACE Video Factory — preview

on:
  workflow_dispatch:
    inputs:
      lesson:
        description: Verified concept lesson ID
        required: true
        default: g10-ch2-ap-sum
        type: choice
        options:
          - g10-ch2-ap-sum
          - g10-ch2-gp-sum
      mode:
        description: Demo has clearly labeled synthetic audio; Gemini requires a secret
        required: true
        default: demo
        type: choice
        options:
          - demo
          - gemini
      render_size:
        description: Preview is small; final is 720x1280 and eligible for review
        required: true
        default: preview
        type: choice
        options:
          - preview
          - final
      cache_revision:
        description: Change this value only to force fresh speech generation
        required: false
        default: v1
        type: string

permissions:
  contents: read

concurrency:
  group: trace-video-preview-${{ github.ref }}-${{ inputs.lesson }}
  cancel-in-progress: false

jobs:
  render-preview:
    name: Create review video artifact (never publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r site/video-factory/requirements.txt
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Validate exact lesson script and prevent early answer reveals
        run: python3 site/tools/trace_video_factory.py self-test --lesson "${{ inputs.lesson }}"
      # Each run gets an immutable cache entry. Restore the most recent matching
      # narration cache, then save even after a failed render to preserve WAV work.
      - name: Resume existing narration segments
        if: inputs.mode == 'gemini'
        uses: actions/cache/restore@v4
        with:
          path: build/trace-video/voice-cache
          key: trace-voice-${{ runner.os }}-${{ inputs.lesson }}-${{ hashFiles('site/video-factory/lessons/*.json') }}-${{ inputs.cache_revision }}-${{ github.run_id }}
          restore-keys: |
            trace-voice-${{ runner.os }}-${{ inputs.lesson }}-${{ hashFiles('site/video-factory/lessons/*.json') }}-${{ inputs.cache_revision }}-
      - name: Render audio-first storyboard
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_LESSON: ${{ inputs.lesson }}
          VIDEO_MODE: ${{ inputs.mode }}
          VIDEO_SIZE: ${{ inputs.render_size }}
        run: |
          set -euo pipefail
          if [[ "$VIDEO_SIZE" == final ]]; then
            W=720; H=1280
          else
            W=360; H=640
          fi
          python3 site/tools/trace_video_factory.py render \
            --lesson "$VIDEO_LESSON" --mode "$VIDEO_MODE" \
            --width "$W" --height "$H" --fps 12 \
            --output build/trace-video/preview \
            --cache build/trace-video/voice-cache
      - name: Save completed narration even if rendering fails
        if: always() && inputs.mode == 'gemini'
        uses: actions/cache/save@v4
        with:
          path: build/trace-video/voice-cache
          key: trace-voice-${{ runner.os }}-${{ inputs.lesson }}-${{ hashFiles('site/video-factory/lessons/*.json') }}-${{ inputs.cache_revision }}-${{ github.run_id }}
      - name: Record review information
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('build/trace-video/preview/result.json').read_text())
          lines=[
              '## TRACE Video Factory preview',
              '',
              f"**Lesson:** {r['lessonId']} · **Mode:** {r['mode']}",
              f"**Runtime:** {r['durationSeconds']:.1f}s · **Portrait:** {r['width']}×{r['height']}",
              f"**SHA-256 approval fingerprint:** {r['sha256']}",
              '',
              'This is a review artifact, not a public video.',
              'Gemini narration must be listened to and maths must be reviewed before publishing.',
              'DEMO mode contains synthetic audio and is not eligible for publication.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('\n'.join(lines)+'\n')
          PY
      - name: Upload review video and provenance, never source audio or API keys
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trace-video-${{ inputs.lesson }}-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            build/trace-video/preview/*.mp4
            build/trace-video/preview/result.json
          retention-days: 7
          if-no-files-found: error
