name: Recover Pages from validated PR 259 (one shot)

on:
  push:
    branches:
      - ops/verified-pages-recovery-pr259-20261118
    paths:
      - .github/workflows/recover-pr259-pages.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-existing-approval:
    name: Check exact green PR 259 website source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source identity, completed required tests and no site changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APPROVED_MAIN=ff2dc9f68d8d573a82140c372189171d4564beb0
          APPROVED_TREE=34c88e8f54bfc5baa19f7da9819f2b59d2429ca4
          APPROVED_HEAD=36c02ef25f40d35f753f49c796fd8349ea9dc260
          APPROVED_RUN=44251216538
          test "$(git rev-parse "$APPROVED_MAIN^{tree}")" = "$APPROVED_TREE"
          test "$(git diff --name-only "$APPROVED_MAIN" HEAD)" = ".github/workflows/recover-pr259-pages.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$APPROVED_HEAD" --jq '.tree.sha')" = "$APPROVED_TREE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN" --jq '.head_sha')" = "$APPROVED_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/259" --jq '.merged')" = "true"
          grep -q "triggle-g9-math-first-student-lab-hcf-gp-20261118-g9ex32" site/service-worker.js
          echo "PASS: Site source is byte-identical to successfully tested and merged PR #259."

  publish-verified-site:
    name: Publish prevalidated website and compare live Pages files
    needs: verify-existing-approval
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pages: write
      id-token: write
