name: TRACE Mensuration mobile preflight — native exponent verification

on:
  push:
    branches: [trace/g10-mensuration-consolidated-20261125]
    paths: [.github/workflows/trace-mensuration-mobile-once.yml, site/tools/test_g10_ch7_ex75_browser.cjs]

permissions:
  contents: read

jobs:
  mobile:
    if: github.repository == 'vigneswaranmba20-afk/Triggle' && github.ref == 'refs/heads/trace/g10-mensuration-consolidated-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm generated project status
        run: npm run status:check
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - name: Exercise 7.4 bilingual mobile views
        run: node site/tools/test_g10_ch7_ex74_browser.cjs
        env:
          CHROMIUM_PATH: ''
      - name: Exercise 7.5 bilingual mobile views
        if: success() || failure()
        run: node site/tools/test_g10_ch7_ex75_browser.cjs
        env:
          CHROMIUM_PATH: ''
      - name: Unit Exercise 7 bilingual mobile views
        if: success() || failure()
        run: node site/tools/test_g10_ch7_unit7_browser.cjs
        env:
          CHROMIUM_PATH: ''
      - name: Confirm inherited Algebra accessibility regression
        if: success() || failure()
        run: node site/tools/test_g10_ch3_ex37_to_39_browser.cjs
        env:
          CHROMIUM_PATH: ''
