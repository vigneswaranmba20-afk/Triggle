# One-off generated-output update after preserving original Ex2.4 student source.
name: TRACE Ex2.4 preserved-baseline rebuild once
on:
  push:
    branches:
      - trace/g9-ch2-ex2-4-decimal-precision-20261117
    paths:
      - .github/workflows/trace-ex24-lock-preserve-regenerate-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trace/g9-ch2-ex2-4-decimal-precision-20261117
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node site/tools/build_g9_math.cjs
      - run: npm run status:build
      - name: Verify original student record preservation and unresolved source
        run: |
          node site/tools/test_standard_solutions.cjs
          node docs/curriculum/grade-9/tests/ex2-4-source-audit-math.cjs
          node site/tools/test_g9_clear_math.cjs
          node site/tools/test_g9_math_compiler.cjs
          npm run status:check
      - name: Commit only exact source-derived output artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/g9-clear-math.js site/data/project-status.json
          if git diff --cached --quiet; then
            echo "Source-derived files unchanged."
          else
            git commit -m "build(g9): regenerate source-preserving Ex2.4 teaching and status"
            git push origin "HEAD:trace/g9-ch2-ex2-4-decimal-precision-20261117"
          fi
