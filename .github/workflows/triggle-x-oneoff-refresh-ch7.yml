name: TRIGGLE X one-off projection regeneration
on:
  push:
    branches:
      - feature/g10-ch7-ex71-pilot-dual-audit-20261122
permissions:
  contents: read
concurrency:
  group: triggle-x-ch7-source-projection
  cancel-in-progress: false
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate authoritative read-only public curriculum projection
        run: node site/tools/build_project_status.cjs
      - name: Commit only the derived snapshot back to this temporary branch
        env:
          TARGET_BRANCH: feature/g10-ch7-ex71-pilot-dual-audit-20261122
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/project-status.json
          if git diff --cached --quiet; then
            echo "Projection already current"
          else
            git commit -m "chore(g10): refresh derived curriculum snapshot after Ex7.1 pilot"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
