name: One-time G10 chapter menu status refresh
on:
  push:
    branches:
      - fix/g10-checkpoint-menu-20261111
    paths:
      - .github/workflows/g10-menu-status-refresh-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerate source-derived public status
        run: node site/tools/build_project_status.cjs
      - name: Commit updated projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(status): refresh public G10 chapter registry snapshot"
            git push origin HEAD:fix/g10-checkpoint-menu-20261111
          fi
