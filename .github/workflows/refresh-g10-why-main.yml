# Temporary one-shot projection repair for merged Grade 10 Why release.
name: One-time refresh Grade 10 Why main projection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-g10-why-main.yml']
permissions:
  contents: write
jobs:
  project-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/tools/build_project_status.cjs
      - name: Commit verified current public projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/project-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(status): reconcile Class 10 Why merged main commit'
            git push origin HEAD:main
          fi
